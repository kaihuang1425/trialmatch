<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<body>
<script src="/loader/syringe-loader.js" data-wait="app" data-max="12000"></script><!-- loading screen: always shows, finishes when the data is ready (shared store or this browser), at most 12 s -->
<title>Trial Match</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,400..700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<style>
/* Trial Match. Layout: dark, Gemini-like. One calm column for patients (Home, Trials, Health, Inbox); a wider workspace for clinicians (Overview, Rank, Applications). Surfaces step up in tone instead of using borders; the blue-violet gradient appears only where the agent speaks. */
:root {
  --bg: #131314; --surface: #1E1F20; --surface-2: #282A2C; --surface-3: #333537; --hover: #37393B;
  --ink: #E3E3E3; --muted: #C4C7C5; --faint: #8E918F; --line: #444746;
  --accent: #A8C7FA; --accent-ink: #062E6F; --accent-soft: #004A77; --on-soft: #C2E7FF;
  --met: #6DD58C; --met-soft: rgba(109,213,140,.14); --not: #F2B8B5; --not-soft: rgba(242,184,181,.14); --unk: #FDD663; --unk-soft: rgba(253,214,99,.13);
  --g1: #4285F4; --g2: #9B72CB; --g3: #D96570;
  --grad: linear-gradient(90deg, var(--g1), var(--g2) 55%, var(--g3));
  --grad-soft: linear-gradient(135deg, rgba(66,133,244,.16), rgba(155,114,203,.12) 55%, rgba(217,101,112,.08));
  --sans: "Google Sans Flex", "Google Sans", "Roboto", "Helvetica Neue", Arial, sans-serif;
  --r-sm: 8px; --r: 16px; --r-lg: 24px; --r-xl: 28px;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
h1, h2, h3 { margin: 0; font-weight: 400; text-wrap: balance; }
p { margin: 0; }
a { color: var(--accent); }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.sm { font-size: 14px; }
.xs { font-size: 12px; }
.grad-text { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
svg { flex: none; width: 20px; height: 20px; }

/* ---------- top bar ---------- */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
.bar-in { display: flex; align-items: center; gap: 16px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1240px; margin: 0 auto; }
.logo { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 500; }
.logo svg { width: 28px; height: 28px; }
.logo small { font-size: 12px; color: var(--faint); font-weight: 400; border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; }
.nav { display: flex; gap: 4px; margin-left: 16px; }
.nav button { height: 40px; padding: 0 16px; border-radius: 20px; color: var(--muted); font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; gap: 8px; position: relative; }
.nav button:hover { background: var(--surface-2); color: var(--ink); }
.nav button[aria-current="page"] { background: var(--accent-soft); color: var(--on-soft); }
.nav svg { width: 20px; height: 20px; }
.badge { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--g3); color: #fff; font-size: 11px; font-weight: 700; display: inline-grid; place-items: center; }
.spacer { flex: 1; }
.me { display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 6px 0 14px; border-radius: 20px; background: var(--surface); font-size: 14px; }
.me:hover { background: var(--surface-2); }
.avatar { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 500; color: #fff; background: linear-gradient(135deg, var(--g1), var(--g2)); }
.avatar.clin { background: linear-gradient(135deg, #1E8E3E, #4285F4); }
.syn { font-size: 12px; color: var(--faint); }
/* tablet widths: the clinician bar has four tabs, so drop the extra labels before anything wraps */
@media (min-width: 761px) and (max-width: 1100px) { .bar .syn, .me .who { display: none; } .logo { white-space: nowrap; } }

/* bottom nav on phones */
.bnav { display: none; }
@media (max-width: 760px) {
  .nav, .me .who, .bar .syn { display: none; }
  .bnav { display: flex; position: fixed; z-index: 25; left: 0; right: 0; bottom: 0; background: var(--surface); padding: 8px max(8px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); justify-content: space-around; }
  .bnav button { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; font-weight: 500; color: var(--muted); flex: 1; position: relative; }
  .bnav button span.ic { width: 56px; height: 32px; border-radius: 16px; display: grid; place-items: center; }
  .bnav button[aria-current="page"] { color: var(--ink); }
  .bnav button[aria-current="page"] span.ic { background: var(--accent-soft); color: var(--on-soft); }
  .bnav svg { width: 22px; height: 22px; }
  .bnav .badge { position: absolute; top: -2px; left: 54%; }
  main { padding-bottom: 96px !important; }
}

main { max-width: 1240px; margin: 0 auto; padding-block: 8px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
@media (min-width: 761px) { main { padding-bottom: 104px; } }   /* clear of the floating "Ask your agent" button (24px up, 52px tall) */
.col { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
.wide { display: flex; flex-direction: column; gap: 24px; }
.page-h { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding-top: 16px; }
.page-h h1 { font-size: clamp(28px, 4.4vw, 36px); line-height: 1.2; }
.page-h p { color: var(--muted); margin-top: 6px; }
.hello { font-size: clamp(32px, 6vw, 44px); line-height: 1.15; padding-top: 24px; }
.sub { color: var(--muted); font-size: 18px; margin-top: 8px; }
.sect-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.sect-h h2 { font-size: 20px; }

/* ---------- buttons ---------- */
.btn { height: 40px; padding: 0 20px; border-radius: 20px; font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: var(--surface-3); color: var(--ink); white-space: nowrap; transition: background .15s, filter .15s; }
.btn:hover { background: var(--hover); }
.btn.pri { background: var(--accent); color: var(--accent-ink); }
.btn.pri:hover { filter: brightness(1.08); }
.btn.tonal { background: var(--accent-soft); color: var(--on-soft); }
.btn.tonal:hover { filter: brightness(1.15); }
.btn.out { background: transparent; box-shadow: inset 0 0 0 1px var(--line); color: var(--accent); }
.btn.out:hover { background: var(--surface-2); }
.btn.text { background: transparent; color: var(--accent); padding: 0 12px; }
.btn.text:hover { background: var(--surface-2); }
.btn.danger { background: transparent; box-shadow: inset 0 0 0 1px var(--line); color: var(--not); }
.btn.big { height: 52px; padding: 0 28px; border-radius: 26px; font-size: 16px; }
.btn:disabled { opacity: .38; pointer-events: none; }
.btn svg { width: 18px; height: 18px; }
.iconbtn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); }
.iconbtn:hover { background: var(--surface-2); color: var(--ink); }
.iconbtn svg { width: 22px; height: 22px; }
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.row.end { justify-content: flex-end; }

/* ---------- surfaces ---------- */
.card { background: var(--surface); border-radius: var(--r-lg); padding: 20px; min-width: 0; }
.card.pad-lg { padding: 24px; }
.card h3 { font-size: 18px; }
.list { display: flex; flex-direction: column; gap: 2px; border-radius: var(--r-lg); overflow: hidden; }
.item { background: var(--surface); padding: 16px 20px; display: flex; align-items: center; gap: 16px; text-align: left; width: 100%; min-width: 0; }
button.item:hover, .item.click:hover { background: var(--surface-2); }
.item .grow { flex: 1; min-width: 0; }
.item b { font-weight: 500; display: block; }
.item small { color: var(--muted); font-size: 14px; display: block; }
.ic-circle { width: 40px; height: 40px; border-radius: 50%; background: var(--surface-3); color: var(--muted); display: grid; place-items: center; flex: none; }
.ic-circle svg { width: 20px; height: 20px; }
.chev { color: var(--faint); width: 20px; height: 20px; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 8px; font-size: 13px; font-weight: 500; background: var(--surface-3); color: var(--muted); white-space: nowrap; }
.chip.met { background: var(--met-soft); color: var(--met); }
.chip.not { background: var(--not-soft); color: var(--not); }
.chip.unk { background: var(--unk-soft); color: var(--unk); }
.chip.acc { background: var(--accent-soft); color: var(--on-soft); }
/* live registry trials */
.lv .grow { display: flex; flex-direction: column; gap: 6px; }
.lv-top { font-size: 12px; color: var(--faint); letter-spacing: .01em; }
.item .lv-t { font-size: 15px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.lv-chips { display: flex; gap: 6px; flex-wrap: wrap; }
.lv-chips .chip { height: 24px; font-size: 12px; }
.lv-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--met); margin-right: 10px; vertical-align: 2px; box-shadow: 0 0 0 0 rgba(109,213,140,.5); animation: lvDot 2s ease-out infinite; }
@keyframes lvDot { 0% { box-shadow: 0 0 0 0 rgba(109,213,140,.5); } 100% { box-shadow: 0 0 0 8px rgba(109,213,140,0); } }
@media (prefers-reduced-motion: reduce) { .lv-dot { animation: none; } }
.chip.byagent { background: var(--grad-soft); color: var(--ink); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--g1); display: inline-block; flex: none; }
.empty { text-align: center; padding: 40px 20px; color: var(--muted); }
.empty h3 { color: var(--ink); font-size: 20px; margin-bottom: 8px; }

/* ---------- agent card (the one gradient surface) ---------- */
.agent { position: relative; border-radius: var(--r-xl); padding: 24px; background: var(--grad-soft), var(--surface); display: flex; flex-direction: column; gap: 18px; }
.agent::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; background: linear-gradient(135deg, rgba(66,133,244,.55), rgba(155,114,203,.35), rgba(217,101,112,.2)); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none; }
.agent-top { display: flex; gap: 16px; align-items: center; }
.spark { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(from 200deg, var(--g1), var(--g2), var(--g3), var(--g1)); position: relative; flex: none; }
.spark::after { content: ""; position: absolute; inset: 2px; border-radius: 50%; background: var(--surface); }
.spark svg { position: relative; z-index: 1; width: 22px; height: 22px; color: var(--accent); }
.spark.live { animation: spin 6s linear infinite; }
.spark.live svg { animation: spin 6s linear infinite reverse; }
@keyframes spin { to { transform: rotate(360deg); } }
.agent-top h2 { font-size: 20px; line-height: 1.3; }
.agent-top p { color: var(--muted); font-size: 14px; }
.agent-now { display: flex; gap: 10px; align-items: center; font-size: 14px; color: var(--muted); }
.agent-ctl { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.toggle { display: flex; align-items: center; gap: 12px; background: var(--surface-2); border-radius: 20px; height: 40px; padding: 0 6px 0 16px; font-size: 14px; font-weight: 500; }
.switch { appearance: none; -webkit-appearance: none; width: 52px; height: 32px; border-radius: 16px; background: var(--surface-3); box-shadow: inset 0 0 0 2px var(--faint); position: relative; cursor: pointer; margin: 0; flex: none; transition: background .2s; }
.switch::after { content: ""; position: absolute; top: 8px; left: 8px; width: 16px; height: 16px; border-radius: 50%; background: var(--faint); transition: all .2s; }
.switch:checked { background: var(--accent); box-shadow: none; }
.switch:checked::after { top: 4px; left: 24px; width: 24px; height: 24px; background: var(--accent-ink); }

/* question card */
.qcard { border-radius: var(--r-xl); background: var(--surface); padding: 24px; display: flex; flex-direction: column; gap: 16px; }
.qcard .from { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.qcard h3 { font-size: 22px; line-height: 1.3; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { min-height: 52px; border-radius: var(--r); background: var(--surface-2); padding: 12px 18px; text-align: left; font-size: 15px; display: flex; align-items: center; gap: 12px; }
.opt:hover { background: var(--hover); }
.opt.on { background: var(--accent-soft); color: var(--on-soft); }

/* trial rows */
.trow { display: flex; gap: 16px; align-items: center; background: var(--surface); padding: 18px 20px; text-align: left; width: 100%; }
.trow:hover { background: var(--surface-2); }
.trow .grow { flex: 1; min-width: 0; }
.trow h3 { font-size: 17px; font-weight: 500; line-height: 1.35; }
.trow .meta { display: flex; gap: 6px 14px; flex-wrap: wrap; color: var(--muted); font-size: 13px; margin-top: 6px; }
.score { font-size: 28px; line-height: 1; font-weight: 400; font-variant-numeric: tabular-nums; }
.score small { display: block; font-size: 11px; color: var(--faint); margin-top: 4px; text-align: center; }
.scorebox { text-align: center; min-width: 52px; }

/* stage progress */
.steps { display: flex; gap: 4px; margin-top: 12px; }
.steps i { flex: 1; height: 4px; border-radius: 2px; background: var(--surface-3); }
.steps i.done { background: var(--accent); }
.steps i.now { background: linear-gradient(90deg, var(--g1), var(--g2)); }
.steps i.bad { background: var(--not); }

/* segmented + chips */
.seg { display: inline-flex; border-radius: 20px; box-shadow: inset 0 0 0 1px var(--line); overflow: hidden; flex-wrap: wrap; }
.seg button { height: 40px; padding: 0 16px; font-size: 14px; font-weight: 500; color: var(--muted); }
.seg button + button { box-shadow: inset 1px 0 0 var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--on-soft); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.fchip { height: 34px; padding: 0 14px; border-radius: 8px; box-shadow: inset 0 0 0 1px var(--line); font-size: 14px; font-weight: 500; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.fchip:hover { background: var(--surface-2); }
.fchip[aria-pressed="true"] { background: var(--accent-soft); color: var(--on-soft); box-shadow: none; }
.fchip .n { font-size: 12px; opacity: .8; }

/* fields */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > span { font-size: 13px; color: var(--muted); font-weight: 500; }
.input { height: 48px; border-radius: 12px; background: var(--surface-2); border: 0; padding: 0 14px; font-size: 16px; width: 100%; box-shadow: inset 0 0 0 1px transparent; }
.input:focus { outline: none; box-shadow: inset 0 0 0 2px var(--accent); }
textarea.input { height: 140px; padding: 12px 14px; resize: vertical; line-height: 1.5; }
select.input { appearance: none; -webkit-appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 20px) 21px, calc(100% - 15px) 21px; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 36px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
@media (max-width: 560px) { .grid2, .grid3 { grid-template-columns: 1fr; } }

/* ---------- sheet ---------- */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.55); display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); width: min(640px, 100%); max-height: min(88vh, 900px); overflow: auto; border-radius: var(--r-xl) var(--r-xl) 0 0; padding: 8px max(20px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 18px; animation: up .22s ease-out; }
.sheet.wide { width: min(860px, 100%); }
@media (min-width: 761px) { .scrim { align-items: center; padding: 24px; } .sheet { border-radius: var(--r-xl); padding: 8px 28px 28px; } }
@keyframes up { from { transform: translateY(24px); opacity: 0; } }
.sheet-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; position: sticky; top: -8px; background: var(--surface); padding-top: 16px; padding-bottom: 4px; z-index: 1; }
.sheet-h h2 { font-size: 22px; line-height: 1.3; }
.handle { width: 32px; height: 4px; border-radius: 2px; background: var(--line); margin: 6px auto 0; }
@media (min-width: 761px) { .handle { display: none; } }

/* rule list */
.rules { display: flex; flex-direction: column; gap: 2px; border-radius: var(--r); overflow: hidden; }
.rule { display: flex; gap: 12px; align-items: flex-start; background: var(--surface-2); padding: 12px 16px; font-size: 14px; }
.rule .mk { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; flex: none; margin-top: 1px; }
.rule .mk.met { background: var(--met-soft); color: var(--met); }
.rule .mk.not { background: var(--not-soft); color: var(--not); }
.rule .mk.unk { background: var(--unk-soft); color: var(--unk); }
.rule small { display: block; color: var(--faint); font-size: 12px; margin-top: 2px; }

/* activity feed */
.feed { display: flex; flex-direction: column; gap: 14px; }
.ev { display: flex; gap: 12px; align-items: flex-start; font-size: 14px; }
.ev .av { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 500; background: var(--surface-3); color: var(--muted); flex: none; }
.ev .av.ag { background: var(--grad-soft); color: var(--on-soft); box-shadow: inset 0 0 0 1px rgba(155,114,203,.4); }
.ev .av.hu { background: rgba(109,213,140,.16); color: var(--met); }
.ev b { font-weight: 500; }
.ev time { color: var(--faint); font-size: 12px; margin-left: 6px; }

/* toast */
.toast { position: fixed; z-index: 60; left: 50%; top: calc(16px + env(safe-area-inset-top, 0px)); transform: translate(-50%, -12px); opacity: 0; transition: all .25s; background: #E3E3E3; color: #1F1F1F; border-radius: 8px; padding: 12px 16px; font-size: 14px; width: max-content; max-width: min(460px, calc(100% - 32px)); display: flex; gap: 10px; align-items: center; box-shadow: 0 4px 16px rgba(0,0,0,.4); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---------- health ---------- */
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
.stat { background: var(--surface); border-radius: var(--r-lg); padding: 16px 18px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.stat .lbl { font-size: 13px; color: var(--muted); }
.stat .val { font-size: 28px; line-height: 1.15; font-variant-numeric: tabular-nums; }
.stat .val small { font-size: 13px; color: var(--faint); margin-left: 4px; }
.stat .src { font-size: 12px; color: var(--faint); }
.stat svg.spk { width: 100%; height: 34px; margin-top: 6px; }
.stat.unknown .val { color: var(--faint); font-size: 18px; padding-top: 8px; }
.dx { display: flex; flex-direction: column; gap: 12px; }
.dx h2 { font-size: 24px; line-height: 1.3; }

/* ---------- login ---------- */
.login { min-height: 100%; display: grid; place-items: center; padding-block: 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: radial-gradient(ellipse 80% 50% at 50% -10%, rgba(66,133,244,.16), transparent 70%), var(--bg); }
.login-box { width: min(440px, 100%); display: flex; flex-direction: column; gap: 24px; }
.login-box .logo { font-size: 24px; }
.login-box h1 { font-size: 36px; line-height: 1.2; }
.acct { display: flex; align-items: center; gap: 14px; background: var(--surface); padding: 14px 18px; text-align: left; width: 100%; }
.acct:hover { background: var(--surface-2); }
.acct .grow { flex: 1; min-width: 0; }
.acct b { font-weight: 500; display: block; }
.acct small { color: var(--muted); font-size: 13px; }
.note { font-size: 13px; color: var(--faint); line-height: 1.5; }

/* ---------- clinician ---------- */

.funnel { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }

.tbl-wrap { overflow-x: auto; }

/* tables on a phone: the .wide columns step aside and their facts move into the first cell (.ph-only),

@media (max-width: 560px) { .ph-tbl .wide { display: none; } .ph-tbl .ph-only { display: inline; } .ph-tbl th, .ph-tbl td { padding-left: 8px; padding-right: 8px; } }
tr.click:hover td { background: var(--surface-2); }
.trialpick { min-width: 0; max-width: 100%; }

/* rank: the swipe deck */

.pcard { background: var(--surface); border-radius: var(--r-xl); padding: 22px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.pcard.bench { background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
.pcard .who { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

.deck { position: relative; touch-action: pan-y; padding-bottom: 14px; }

.deck .top { position: relative; z-index: 1; cursor: grab; box-shadow: 0 10px 30px rgba(0,0,0,.35); transition: transform .3s ease, opacity .3s; will-change: transform; user-select: none; -webkit-user-select: none; }

.swipe-btns { display: flex; justify-content: center; gap: 28px; margin-top: 18px; }

.sbtn:hover span { transform: scale(1.06); background: var(--hover); }
.sbtn svg { width: 26px; height: 26px; }

.progress { height: 4px; border-radius: 2px; background: var(--surface-3); overflow: hidden; }

/* stepper in detail */
.stepper { display: flex; gap: 6px; flex-wrap: wrap; }

.stepper span.done { color: var(--muted); }
.stepper span.now { background: var(--accent); color: var(--accent-ink); }
.stepper span.bad { background: var(--not-soft); color: var(--not); }
/* applicant progress track: dots joined by a line, Gemini gradient up to the current step */
.prog { flex: none; display: flex; align-items: flex-start; overflow-x: auto; scrollbar-width: none; padding: 4px 0 2px; margin: 0 -4px; }
.prog::-webkit-scrollbar { display: none; }
.pg { flex: 1 0 68px; display: flex; flex-direction: column; align-items: center; gap: 8px; position: relative; font-size: 12px; font-weight: 500; color: var(--faint); text-align: center; line-height: 1.25; padding: 0 2px; }
.pg::before { content: ""; position: absolute; top: 6px; right: 50%; width: 100%; height: 2px; background: var(--surface-3); }
.pg:first-child::before { display: none; }
.pg i { position: relative; z-index: 1; width: 14px; height: 14px; border-radius: 50%; background: var(--surface); box-shadow: inset 0 0 0 2px var(--line); display: grid; place-items: center; font-style: normal; font-size: 9px; font-weight: 700; flex: none; }
.pg.done { color: var(--muted); }
.pg.done i { background: linear-gradient(135deg, var(--g1), var(--g2)); box-shadow: none; }

.pg.now { color: var(--ink); }

.pg.bad { color: var(--not); }
.pg.bad i { background: var(--not); color: #601410; box-shadow: 0 0 0 5px var(--not-soft); }
.pg.bad::before { background: repeating-linear-gradient(90deg, var(--not) 0 4px, transparent 4px 8px); opacity: .7; }
.pg.wait { color: var(--unk); }
.pg.wait i { background: var(--unk); box-shadow: 0 0 0 5px var(--unk-soft); }
@keyframes pgNow { 0%, 100% { box-shadow: 0 0 0 5px rgba(168,199,250,.18); } 50% { box-shadow: 0 0 0 9px rgba(168,199,250,.05); } }
@media (prefers-reduced-motion: reduce) { .pg.now i { animation: none; } }
.panel2 { background: var(--surface-2); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 14px; }
details summary { cursor: pointer; color: var(--accent); font-size: 14px; font-weight: 500; list-style: none; }
details summary::-webkit-details-marker { display: none; }
details[open] summary { margin-bottom: 10px; }
.banner { background: var(--unk-soft); color: var(--unk); border-radius: var(--r); padding: 10px 14px; font-size: 13px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
/* ---------- swipe cards (patients) ---------- */
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.disc { max-width: 560px; gap: 16px; }
.disc-h { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: end; }
.disc-h > div:first-child { grid-column: 1 / -1; }
.deck .ghost > * { visibility: hidden; }
.rank-label svg { width: 16px; height: 16px; }
.agent-pill { display: flex; align-items: center; gap: 12px; text-align: left; padding: 10px 14px; border-radius: 20px; background: var(--grad-soft), var(--surface); min-width: 0; position: relative; }
.agent-pill::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; background: linear-gradient(135deg, rgba(66,133,244,.5), rgba(155,114,203,.3), rgba(217,101,112,.15)); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none; }
.agent-pill:hover { background: var(--grad-soft), var(--surface-2); }
.agent-pill .grow { flex: 1; min-width: 0; }
.agent-pill b { font-weight: 500; font-size: 14px; display: block; }
.agent-pill small { color: var(--muted); font-size: 13px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tune { background: var(--surface); width: 48px; height: 48px; }
.spark.sm { width: 30px; height: 30px; }
.spark.sm svg { width: 15px; height: 15px; }
.deck-meta { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; color: var(--muted); padding: 0 4px; flex-wrap: wrap; }
.tcard { gap: 14px; padding: 24px; }
.tc-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.code { font-size: 13px; color: var(--faint); margin-top: 8px; }
.tc-title { font-size: clamp(22px, 5vw, 26px); line-height: 1.25; }
.tc-plain { font-size: 15px; }
.tc-facts { display: flex; flex-direction: column; gap: 8px; font-size: 14px; color: var(--muted); background: var(--surface-2); border-radius: var(--r); padding: 14px 16px; }
.tc-facts span { display: flex; gap: 10px; align-items: center; }
.tc-facts svg { width: 18px; height: 18px; color: var(--accent); }
.why { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; font-size: 15px; }
.why li { display: flex; gap: 10px; align-items: flex-start; }
.why svg { width: 18px; height: 18px; color: var(--met); margin-top: 2px; }
.tbc { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--unk); }
.tbc svg { width: 18px; height: 18px; }
.qc .from { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
.qt { font-size: 24px; line-height: 1.3; }
.empty-card { align-items: center; text-align: center; padding: 40px 24px; gap: 14px; }
.empty-card h3 { font-size: 22px; }
.ring { position: relative; width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; flex: none; --c: var(--met); }
.ring.possible { --c: var(--unk); }
.ring.not { --c: var(--not); }
.ring::before { content: ""; position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(var(--c) var(--deg), var(--surface-3) 0); -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 4px)); mask: radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 4px)); }
.ring span { font-size: 17px; font-weight: 500; font-variant-numeric: tabular-nums; display: flex; flex-direction: column; align-items: center; line-height: 1.05; }
.ring span small { font-size: 9.5px; font-weight: 500; color: var(--faint); letter-spacing: .04em; text-transform: uppercase; }
.ic-circle.ag { background: var(--grad-soft); color: var(--on-soft); }
.ic-circle.hu { background: var(--met-soft); color: var(--met); }
.item.unread b { color: var(--ink); }
.ev .av svg { width: 15px; height: 15px; }
.mini { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; width: 120px; margin-bottom: 4px; }
.mini i { display: block; height: 100%; background: linear-gradient(90deg, var(--g1), var(--g2)); }
.chip svg { width: 14px; height: 14px; }
.stamp.up { left: 22px; right: auto; }
.stamp.down { right: 22px; left: auto; }
input[type="checkbox"]:not(.switch) { width: 18px; height: 18px; accent-color: var(--accent); }
@media (max-width: 860px) {
  .pcard.bench { padding: 16px 18px; gap: 10px; }
  .pcard.bench .facts, .pcard.bench > .faint { display: none; }
  .pcard.bench .ring { width: 44px; height: 44px; }
}
/* ---------- 3D protein view in the applicant sheet ---------- */
.pvbox { display: flex; flex-direction: column; gap: 10px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,.06); }
.pvcard > .pvbox { border-top: 0; padding-top: 0; }
.pvbox-h { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 14px; color: var(--faint); }
.pvbox-h small { font-size: 12px; }
.pvbox .pv-root.pv-embed { --pv-ink: #E3E3E3; --pv-muted: #8E918F; --pv-line: #444746; --pv-link: #A8C7FA; --pv-unk: #FDD663; --pv-unk-ink: #FDD663; --pv-unk-soft: rgba(253,214,99,.13); --pv-neg-ink: #C4C7C5; --pv-neg-soft: #333537; --pv-rail: rgba(19,19,20,.74); --pv-rail-on: #004A77; --pv-rail-on-ink: #C2E7FF; --pv-display: var(--sans); --pv-body: var(--sans); --pv-mono: var(--sans); min-height: 0; height: auto; background: transparent; font-size: 14px; }
.pvbox .pv-embed .pv-stage { flex: none; height: clamp(220px, 36vh, 320px); border-radius: var(--r); }

.pvbox .pv-embed .pv-calm { padding: 4px 0; }
.pvbox .pv-segb { font-weight: 500; font-size: 14px; height: 42px; }
.pvbox .pv-cap { font-size: 14px; min-height: 40px; }
.pvbox .pv-k, .pvbox .pv-d { font-weight: 500; }
.pvbox .pv-honest, .pvbox .pv-pdb { font-size: 12px; }
.pvbox .pv-calm { gap: 12px; }
.pvbox .pv-calm > svg { display: none; }
.pvbox .pv-gl-h { font: 500 13px var(--sans); letter-spacing: 0; text-transform: none; color: var(--muted); }
.pvbox .pv-chip { height: 30px; padding: 0 12px 0 9px; font-size: 13px; font-weight: 500; gap: 6px; }
.pvbox .pv-neg { background: var(--surface-3); color: var(--muted); }
.pvbox .pv-unk { background: var(--unk-soft); color: var(--unk); box-shadow: none; }
/* ---------- Ask your agent (chat) ---------- */
.fab { position: fixed; z-index: 30; right: max(24px, env(safe-area-inset-right, 0px)); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); display: inline-flex; align-items: center; gap: 10px; height: 52px; padding: 0 20px 0 8px; border-radius: 26px; background: var(--grad-soft), var(--surface-2); color: var(--ink); font-size: 15px; font-weight: 500; box-shadow: 0 10px 30px rgba(0,0,0,.45), inset 0 0 0 1px rgba(155,114,203,.35); transition: transform .2s cubic-bezier(.2,.8,.2,1), box-shadow .2s; }
.fab:hover { transform: translateY(-2px); box-shadow: 0 14px 34px rgba(0,0,0,.5), inset 0 0 0 1px rgba(155,114,203,.55); }
.fab:active { transform: scale(.96); }
.fab .spark { width: 36px; height: 36px; }
/* phones: the chat opens from an "Ask" tab in the bottom bar, so nothing floats over the cards */
@media (max-width: 760px) { .fab { display: none; } .bnav .bn-ask .ic { color: var(--on-soft); } .bnav .bn-ask .ic svg { width: 22px; height: 22px; }
  /* long trial chips wrap instead of pushing the sheet sideways */
  .sheet .chips .chip { white-space: normal; height: auto; min-height: 26px; padding-top: 4px; padding-bottom: 4px; }
  /* .sheet prefix: these come before the general chat rules below, so they need the extra weight to win */
  .sheet .chat-sug { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: 0 -20px; padding: 0 20px; flex: none; } .sheet .chat-sug::-webkit-scrollbar { display: none; } .sheet .chat-sug button { flex: none; white-space: nowrap; } }
/* an action the agent offers to take: nothing happens until the person taps it */
.act-card { margin-top: 10px; padding: 14px; border-radius: 16px; background: var(--grad-soft), var(--surface-2); box-shadow: inset 0 0 0 1px rgba(168,199,250,.22); display: flex; flex-direction: column; gap: 10px; }
.act-h { display: flex; gap: 10px; align-items: center; }
.act-h b { font-weight: 500; display: block; }
.act-h small { display: block; color: var(--muted); font-size: 12.5px; }
.act-by { flex: none; align-self: flex-start; font-size: 11.5px; color: var(--muted); padding: 3px 8px; border-radius: 10px; background: rgba(255,255,255,.06); }
.act-card .sm { margin: 0; }
.loop-opts .opt { min-height: 44px; padding: 10px 14px; font-size: 14px; background: var(--surface-3); }
.loop-opts .opt:hover { background: var(--hover); }
.act-done { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 13.5px; color: var(--met); }
.act-done svg { width: 16px; height: 16px; flex: none; }
.chat-thread { display: flex; flex-direction: column; gap: 16px; max-height: min(48vh, 440px); min-height: 120px; overflow-y: auto; overscroll-behavior: contain; padding: 4px 2px; }
/* in the sheet the conversation is the one thing that scrolls: it takes whatever height the header, input and footer
   leave, so those never get pushed off the bottom and the sheet never grows a second scrollbar */
.sheet > .chat-thread { flex: 1 1 auto; min-height: 96px; max-height: none; padding: 4px 8px; margin: 0 -8px; }   /* room for hover pills and focus rings at the edges */
.sheet:has(> .chat-thread) > :not(.chat-thread) { flex-shrink: 0; }
/* once there's a conversation, the suggestions keep to one swipeable row, faded at the end, so they never squeeze it */
.sheet:has(.msg.user) .chat-sug { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding-right: 32px; -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 32px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 32px), transparent); }
.sheet:has(.msg.user) .chat-sug::-webkit-scrollbar { display: none; }
.sheet:has(.msg.user) .chat-sug button { flex: none; white-space: nowrap; }
.msg.user { align-self: flex-end; background: var(--surface-3); border-radius: 18px 18px 4px 18px; padding: 10px 16px; max-width: 85%; font-size: 15px; white-space: pre-wrap; }
.msg.agent { display: flex; flex-direction: column; gap: 10px; max-width: 100%; }
.msg.agent > p { margin: 0; font-size: 15px; }
.msg.agent.model > p { white-space: pre-wrap; }
.msg.agent ul { margin: 0; padding-left: 20px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
.msg .by { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 500; color: var(--faint); }
.msg .by .spark { width: 22px; height: 22px; }
.msg .by .spark svg { width: 12px; height: 12px; }
.msg .note { margin: 0; }
.msg .steps { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--faint); }
.msg .steps span { display: flex; align-items: center; gap: 6px; }
.msg .steps svg { width: 12px; height: 12px; flex: none; color: var(--met); }
.msg .steps .no svg { color: var(--not); }
.msg.pending p { color: var(--faint); }
.dots::after { content: ""; display: inline-block; width: 1.2em; text-align: left; animation: chatDots 1.2s steps(4) infinite; }
@keyframes chatDots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
.chat-sug { display: flex; gap: 8px; flex-wrap: wrap; }
.chat-sug button { min-height: 34px; padding: 6px 14px; line-height: 1.35; max-width: 100%; border-radius: 17px; box-shadow: inset 0 0 0 1px var(--line); font-size: 13.5px; color: var(--muted); text-align: left; }
.chat-sug button:hover { background: var(--surface-2); color: var(--ink); }
.chat-sug button:disabled { opacity: .45; }
.chat-sug button[data-model] { display: inline-flex; align-items: center; gap: 6px; color: var(--on-soft); background: var(--accent-soft); box-shadow: none; }
.chat-sug button[data-model] svg { width: 13px; height: 13px; flex: none; }
.chat-ask { display: flex; gap: 8px; align-items: center; background: var(--surface-2); border-radius: 28px; padding: 6px 6px 6px 20px; }
.chat-ask input { flex: 1; min-width: 0; height: 44px; background: none; border: 0; font-size: 16px; color: var(--ink); }
.chat-ask input:focus { outline: none; }
.chat-ask:focus-within { box-shadow: inset 0 0 0 2px var(--accent); }
.chat-ask .send { width: 44px; height: 44px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; flex: none; }
.chat-ask .send:disabled { opacity: .4; }
.chat-ask .send svg { width: 20px; height: 20px; }
.setup { display: flex; flex-direction: column; gap: 14px; }
.setup ol { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 14px; font-size: 14px; }
.setup li b { font-weight: 500; }
.cmd { display: flex; align-items: center; gap: 8px; margin-top: 8px; background: var(--bg); border-radius: 12px; padding: 8px 8px 8px 14px; }
.cmd code { flex: 1; min-width: 0; font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--on-soft); overflow-x: auto; white-space: nowrap; }
.cmd button { flex: none; height: 30px; padding: 0 12px; border-radius: 15px; font-size: 12.5px; font-weight: 500; background: var(--surface-3); color: var(--ink); }

/* ---------- the team: a Researcher online, an Analyst on this device. Green is "stays here", blue is "online". ---------- */
.msg.tm { gap: 12px; }
.tm-av { position: relative; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: #fff; flex: none; font-style: normal; }
.tm-av svg { width: 17px; height: 17px; }

.tm-av.m { background: linear-gradient(135deg, #188038, #12807A); }
.tm-av.c { background: var(--surface-3); color: var(--accent); }
.tm[data-stage="research"] .tm-lane.net, .tm[data-stage="analyse"] .tm-lane.loc { box-shadow: inset 0 0 0 1px rgba(168,199,250,.45), 0 0 24px -8px rgba(66,133,244,.5); }
.tm[data-stage="analyse"] .tm-lane.loc { box-shadow: inset 0 0 0 1px rgba(109,213,140,.5), 0 0 24px -8px rgba(109,213,140,.45); }
@keyframes tmFlip { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
.tm[data-stage="analyse"] .tm-vault::after { content: ""; position: absolute; top: 0; bottom: 0; width: 45%; background: linear-gradient(90deg, transparent, rgba(109,213,140,.28), transparent); animation: tmScan 1.5s ease-in-out infinite; }
.tm-srcs { display: flex; flex-wrap: wrap; gap: 5px; }
.tm-src { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 9px; border-radius: 12px; font-size: 11.5px; color: var(--faint); background: rgba(0,0,0,.24); transition: color .3s, background .3s, box-shadow .3s; }
.tm-src i { font-style: normal; font-variant-numeric: tabular-nums; font-weight: 500; color: var(--accent); }
.tm-src i:empty { display: none; }
.tm-src[data-state="run"] { color: var(--on-soft); box-shadow: inset 0 0 0 1px rgba(168,199,250,.55); animation: tmBlink 1.1s ease-in-out infinite; }
.tm-src[data-state="ok"] { color: var(--ink); background: rgba(66,133,244,.2); }
.tm-src[data-state="none"] { text-decoration: line-through; text-decoration-color: rgba(196,199,197,.4); }
.tm-src.pop { animation: tmPop .45s cubic-bezier(.3,1.6,.5,1); }
@keyframes tmBlink { 50% { box-shadow: inset 0 0 0 1px rgba(168,199,250,.15); } }
@keyframes tmPop { 0% { transform: scale(.82); } 100% { transform: scale(1); } }
@keyframes tmGate { 0% { box-shadow: inset 0 0 0 1.5px rgba(109,213,140,.6), 0 0 0 0 rgba(109,213,140,.55); } 100% { box-shadow: inset 0 0 0 1.5px rgba(109,213,140,.6), 0 0 0 14px rgba(109,213,140,0); } }
.tm-guard { border-radius: 16px; padding: 12px 14px; background: rgba(109,213,140,.07); box-shadow: inset 0 0 0 1px rgba(109,213,140,.22); display: flex; flex-direction: column; gap: 9px; font-size: 13px; }
.tm-guard.live { animation: tmUp .4s cubic-bezier(.2,.8,.2,1); }
.tm-gh { display: flex; align-items: center; gap: 8px; } .tm-gh svg { width: 17px; height: 17px; color: var(--met); } .tm-gh b { font-weight: 500; color: #9BE0AE; } .tm-gh .faint { font-size: 12px; }
.tm-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.tm-lbl { width: 84px; flex: none; font-size: 11px; font-weight: 500; letter-spacing: .05em; text-transform: uppercase; color: var(--faint); }
.tm-word { display: inline-flex; align-items: center; height: 24px; padding: 0 9px; border-radius: 12px; background: var(--surface-3); color: var(--ink); font-size: 12px; }
.tm-word.k { background: rgba(66,133,244,.2); color: var(--on-soft); } .tm-word.c { color: var(--muted); }
.tm-guard.live .tm-word { animation: tmWord .4s cubic-bezier(.3,1.5,.5,1) both; }
@keyframes tmWord { from { opacity: 0; transform: translateY(6px) scale(.88); } }
.tm-keep { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); margin-right: 6px; }
.tm-keep svg { width: 12px; height: 12px; color: var(--met); }
.tm-echo { display: flex; align-items: center; gap: 6px; margin: 0; font-size: 12.5px; color: #9BE0AE; animation: tmFlip .4s ease-out; }
.tm-echo svg { width: 14px; height: 14px; } .tm-echo.no { color: var(--unk); }
.tm-trace { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1px; }
.tm-trace li { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 8px; align-items: start; padding: 3px 0; font-size: 12.5px; line-height: 1.4; color: var(--muted); }
.tm-trace li b { font-weight: 500; color: var(--ink); margin-right: 2px; }
.tm-trace li.in { animation: tmLi .35s ease-out; } @keyframes tmLi { from { opacity: 0; transform: translateX(-8px); } }
.tm-dot { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; }
.tm-dot svg { width: 10px; height: 10px; }
.tm-trace li.pop .tm-dot { animation: tmPop .45s cubic-bezier(.3,1.6,.5,1); }
.tm-trace [data-agent="researcher"] .tm-dot { background: rgba(66,133,244,.22); color: var(--accent); }
.tm-trace [data-agent="analyst"] .tm-dot { background: rgba(109,213,140,.18); color: var(--met); }
.tm-trace [data-agent="guard"] .tm-dot { background: rgba(109,213,140,.12); color: #9BE0AE; }
.tm-trace [data-agent="coordinator"] .tm-dot { background: var(--surface-3); color: var(--muted); }
.tm-trace li[data-state="run"] .tm-dot::before { content: ""; width: 9px; height: 9px; border-radius: 50%; border: 1.6px solid currentColor; border-right-color: transparent; animation: spin .8s linear infinite; }
.tm-trace li[data-state="fail"] { color: var(--not); } .tm-trace li[data-state="fail"] .tm-dot { background: var(--not-soft); color: var(--not); }
.tm-t { font-size: 11.5px; color: var(--faint); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tm-outs { display: flex; flex-direction: column; gap: 12px; } .tm-outs:empty { display: none; }
.tm-out { border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 10px; background: var(--surface-2); animation: tmUp .5s cubic-bezier(.2,.8,.2,1); }
.tm-out.static { animation: none; }
.tm-out.res { box-shadow: inset 0 0 0 1px rgba(168,199,250,.16); }
.tm-out.mine { background: linear-gradient(160deg, rgba(109,213,140,.1), transparent 65%), var(--surface-2); box-shadow: inset 0 0 0 1px rgba(109,213,140,.2); }
@keyframes tmUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.tm-oh { display: flex; align-items: center; gap: 10px; }
.tm-oh .tm-av { width: 28px; height: 28px; } .tm-oh .tm-av svg { width: 14px; height: 14px; }
.tm-oh b { display: block; font-size: 15px; font-weight: 500; } .tm-oh small { display: block; font-size: 12px; color: var(--faint); }
.tm-out p { margin: 0; font-size: 15px; white-space: pre-wrap; }
.tm-drug { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; min-height: 26px; padding: 3px 11px; border-radius: 13px; background: rgba(66,133,244,.16); color: var(--on-soft); font-size: 12.5px; }
.tm-drug svg { width: 14px; height: 14px; }
.tm-meta { font-size: 13px !important; color: var(--muted); } .tm-meta b { font-weight: 500; color: var(--ink); margin-right: 6px; }
.cite { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 4px; margin-left: 3px; border-radius: 9px; background: rgba(168,199,250,.16); color: var(--accent); font-size: 11px; font-weight: 500; text-decoration: none; vertical-align: 2px; line-height: 1; white-space: nowrap; }
a.cite:hover { background: rgba(168,199,250,.32); }
.tm-refs { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
.tm-refs li { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; align-items: start; font-size: 13px; line-height: 1.4; }
.tm-refs li .cite { margin: 1px 0 0; vertical-align: 0; }
.tm-refs a { color: var(--ink); text-decoration: none; } .tm-refs a:hover { color: var(--accent); text-decoration: underline; }
.tm-refs small { display: block; font-size: 12px; color: var(--faint); }
.tm-more summary { font-size: 13px; }
.tm-caret::after { content: ""; display: inline-block; width: 2px; height: 1em; margin-left: 2px; vertical-align: -2px; background: var(--met); animation: tmCaret 1s steps(2) infinite; }
@keyframes tmCaret { 50% { opacity: 0; } }
.tm-think { display: flex; align-items: center; gap: 10px; font-size: 13.5px !important; color: var(--faint); }
.tm-bounce { display: inline-flex; gap: 4px; } .tm-bounce i { width: 6px; height: 6px; border-radius: 50%; background: var(--met); animation: tmB 1.1s ease-in-out infinite; }
.tm-bounce i:nth-child(2) { animation-delay: .15s; } .tm-bounce i:nth-child(3) { animation-delay: .3s; }
@keyframes tmB { 0%, 80%, 100% { transform: translateY(0); opacity: .4; } 40% { transform: translateY(-5px); opacity: 1; } }
.tm-k { display: block; font-weight: 500; color: #9BE0AE; font-size: 12.5px; margin-top: 8px; } .tm-k:first-child { margin-top: 0; }
.tm-av.o { background: linear-gradient(135deg, #1A73E8, #0B57D0); }
.tm-phase { display: inline-block; margin: 0 6px 0 4px; padding: 0 7px; height: 17px; line-height: 17px; border-radius: 9px; font-size: 10.5px; font-weight: 500; letter-spacing: .04em; text-transform: uppercase; background: var(--surface-3); color: var(--muted); vertical-align: 1px; }
.tm-hint { margin: 0; font-size: 12px; color: var(--faint); }
.tm-warn { display: flex; gap: 8px; align-items: flex-start; margin: 0; padding: 8px 10px; border-radius: 12px; background: var(--unk-soft); color: var(--unk); font-size: 12.5px; line-height: 1.4; }
.tm-warn svg { width: 15px; height: 15px; flex: none; margin-top: 1px; }
.tm-say { margin: 0; font-size: 15px; }
.tm-checks { display: flex; flex-direction: column; gap: 6px; padding-top: 10px; border-top: 1px solid rgba(109,213,140,.16); }
.tm-checks .tm-lbl { width: auto; }   /* a heading over the list here, not a column beside a row, so it gets the full width */
.tm-chk { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 8px; align-items: start; font-size: 13px; line-height: 1.4; color: var(--muted); }
.tm-chk svg { width: 18px; height: 18px; padding: 4px; border-radius: 50%; }
.tm-chk.met svg { color: var(--met); background: var(--met-soft); } .tm-chk.not svg { color: var(--not); background: var(--not-soft); } .tm-chk.unk svg { color: var(--unk); background: var(--unk-soft); }
.tm-out.mine:not(.static) .tm-chk { animation: tmLi .4s ease-out both; } .tm-out.mine:not(.static) .tm-chk:nth-child(3) { animation-delay: .12s; } .tm-out.mine:not(.static) .tm-chk:nth-child(4) { animation-delay: .24s; }
/* ---------- the crew: your agent in the middle, the agents it hands work to either side of the privacy guard.
   Same language as the rest: tone steps instead of borders, the Gemini gradient only where an agent is thinking,
   green for "stays on this device", blue for "online". A task flies along the line to the agent that takes it. ---------- */
.msg.agent.cr { gap: 10px; padding: 0; border-radius: 0; background: none; }   /* the stage is the card: no agent bubble around it */
.msg.agent.cr::before { display: none; }
.cr-head { align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; min-height: 30px; padding: 0 12px 0 6px; margin-left: -6px; border-radius: 15px; font-size: 13.5px; color: var(--muted); text-align: left; }
.cr-head:hover { background: var(--surface-2); color: var(--ink); }
.cr-head svg { width: 14px; height: 14px; color: var(--faint); transition: transform .25s cubic-bezier(.2,.8,.2,1); }
.cr[data-open="1"] .cr-head svg { transform: rotate(90deg); }
.cr-time { color: var(--faint); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.cr-shim { background: linear-gradient(90deg, var(--muted) 0 35%, #fff 50%, var(--muted) 65% 100%); background-size: 300% 100%; -webkit-background-clip: text; background-clip: text; color: transparent !important; animation: crShim 2.2s linear infinite; }
@keyframes crShim { from { background-position: 100% 0; } to { background-position: 0 0; } }
.cr-stage { position: relative; border-radius: 22px; padding: 0 8px 8px; background: var(--surface-2); }
.cr-top { margin: 0 -8px; padding: 10px 8px 0; border-radius: 22px 22px 0 0; background: var(--surface-2); }
.cr[data-live] .cr-top { position: sticky; top: -4px; z-index: 4; padding-bottom: 6px; border-radius: 22px; box-shadow: 0 10px 18px -12px rgba(0,0,0,.7);
  background: radial-gradient(90% 150% at 50% 0%, rgba(66,133,244,.14), rgba(155,114,203,.06) 45%, transparent 75%), var(--surface-2); }
.cr-rail { position: relative; display: grid; align-items: start; }
.cr-track { position: absolute; top: 34px; height: 2px; margin-top: -1px; border-radius: 1px; background: rgba(196,199,197,.13); }
.cr-beam { position: absolute; top: 34px; height: 2px; margin-top: -1px; border-radius: 1px; opacity: 0; transition: opacity .35s;
  background: linear-gradient(90deg, rgba(66,133,244,0), var(--g1) 30%, var(--g2) 55%, var(--g3) 75%, rgba(217,101,112,0)) 0 0 / 90px 100% repeat-x; }
.cr-beam.on { opacity: 1; animation: crFlow .9s linear infinite; } .cr-beam.on.rev { animation-direction: reverse; }
@keyframes crFlow { to { background-position: 90px 0; } }
.cr-node { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; padding: 12px 2px 8px; border-radius: 16px; color: var(--muted); transition: background .2s, color .3s; }
.cr-node:hover { background: rgba(255,255,255,.035); }
.cr[data-open="1"] .cr-node[aria-selected="true"] { background: rgba(255,255,255,.055); color: var(--ink); }
.cr-node .cr-nm { margin-top: 6px; max-width: 100%; font-size: 12.5px; font-weight: 500; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cr-node small { max-width: 100%; font-size: 11px; color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cr-ring { position: relative; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; }
.cr-ring .tm-av { width: 36px; height: 36px; transition: filter .45s, transform .45s cubic-bezier(.3,1.5,.5,1); } .cr-ring .tm-av svg { width: 17px; height: 17px; }
.cr-ring::before { content: ""; position: absolute; inset: 0; border-radius: 50%; opacity: 0; transition: opacity .3s;
  background: conic-gradient(var(--g1), var(--g2), var(--g3), rgba(217,101,112,0) 72%, rgba(66,133,244,0));
  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2.5px)); mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2.5px)); }
.cr-node[data-state="run"] .cr-ring::before { opacity: 1; animation: spin 1.1s linear infinite; }
.cr-node[data-state="wait"] { color: var(--faint); }
.cr-node[data-state="wait"] .tm-av { filter: saturate(.2) brightness(.55); transform: scale(.9); }
.cr-node[data-state="fail"] .tm-av { filter: grayscale(1) brightness(.6); }
.cr-badge { position: absolute; z-index: 2; right: 0; bottom: 0; width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center; transform: scale(0); transition: transform .4s cubic-bezier(.3,1.6,.5,1); box-shadow: 0 0 0 2px var(--surface-2); }
.cr-badge svg { width: 10px; height: 10px; }
.cr-badge.ok { background: var(--met); color: #053d1c; } .cr-badge.no { background: var(--not); color: #601410; }
.cr-node[data-state="done"] .cr-badge.ok, .cr-node[data-state="fail"] .cr-badge.no { transform: scale(1); }
.cr-node.hit .cr-ring { animation: crHit .5s cubic-bezier(.3,1.5,.5,1); }
@keyframes crHit { 40% { transform: scale(1.14); } }
/* your agent: the Gemini spark, turning while it plans, glowing while its team works */
.cr-node.lead { padding-top: 8px; }
.cr-node.lead .cr-ring { width: 52px; height: 52px; } .cr-node.lead .cr-ring::before { display: none; }
.cr-spark { position: relative; width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(from 200deg, var(--g1), var(--g2), var(--g3), var(--g1)); }
.cr-spark::after { content: ""; position: absolute; inset: 2px; border-radius: 50%; background: var(--surface-2); }
.cr-spark svg { position: relative; z-index: 1; width: 22px; height: 22px; color: var(--accent); }
.cr-spark.sm { width: 28px; height: 28px; flex: none; } .cr-spark.sm::after { background: var(--surface); } .cr-spark.sm svg { width: 14px; height: 14px; }
.cr-node.lead[data-state="run"] .cr-spark { animation: spin 3s linear infinite; } .cr-node.lead[data-state="run"] .cr-spark svg { animation: spin 3s linear infinite reverse; }
.cr-node.lead[data-state="hold"] .cr-spark, .cr-node.lead[data-state="ask"] .cr-spark { animation: crGlow 2.2s ease-in-out infinite; }
@keyframes crGlow { 50% { box-shadow: 0 0 0 5px rgba(155,114,203,.16), 0 0 22px rgba(66,133,244,.35); } }
.cr-node.lead[data-state="fail"] .cr-spark { filter: grayscale(.8) brightness(.8); }
.cr-gate { position: relative; z-index: 1; display: grid; justify-items: center; padding-top: 21px; color: var(--met); }
.cr-gate i { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); box-shadow: inset 0 0 0 1.5px rgba(109,213,140,.55); }
.cr-gate svg { width: 13px; height: 13px; }
.cr-gate.flash i { animation: tmGate 1s ease-out; }
.cr-pk { position: absolute; top: 34px; left: 0; z-index: 3; display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 10px; border-radius: 12px; font-size: 11.5px; font-weight: 500; white-space: nowrap; pointer-events: none; opacity: 0;
  transform: translate(-50%, -50%); box-shadow: 0 6px 18px rgba(0,0,0,.5); background: linear-gradient(90deg, var(--g1), var(--g2)); color: #fff; }
.cr-pk svg { width: 12px; height: 12px; }
.cr-pk.safe { background: var(--met); color: #053d1c; } .cr-pk.warn { background: var(--unk); color: #3d2e00; } .cr-pk.back { background: var(--accent); color: var(--accent-ink); }
.cr-caps { display: grid; margin-top: 2px; font-size: 10.5px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; }
.cr-caps span { display: flex; align-items: center; justify-content: center; gap: 5px; margin: 0 4px; padding-top: 6px; border-top: 1.5px solid; white-space: nowrap; overflow: hidden; }
.cr-caps svg { width: 12px; height: 12px; }
.cr-caps .loc { color: #9BE0AE; border-color: rgba(109,213,140,.28); } .cr-caps .net { color: var(--accent); border-color: rgba(168,199,250,.28); }
.cr-fold { display: grid; grid-template-rows: 1fr; transition: grid-template-rows .4s cubic-bezier(.2,.8,.2,1); }
.cr[data-open="0"] .cr-fold { grid-template-rows: 0fr; }
.cr-fold > div { min-height: 0; overflow: hidden; padding-top: 12px; }
.cr[data-open="0"] .cr-fold > div { visibility: hidden; transition: visibility 0s .4s; }
.cr-panel { position: relative; border-radius: 16px; background: var(--surface); padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 10px; }
.cr-panel::before { content: ""; position: absolute; top: -6px; left: var(--nx, 50%); width: 12px; height: 12px; margin-left: -6px; border-radius: 2px; background: var(--surface); transform: rotate(45deg); transition: left .35s cubic-bezier(.2,.8,.2,1); }
.cr-panel.swap > * { animation: tmFlip .3s ease-out both; }
.cr-ph { display: flex; align-items: center; gap: 10px; }
.cr-ph .tm-av { width: 28px; height: 28px; } .cr-ph .tm-av svg { width: 14px; height: 14px; }
.cr-ph .grow { flex: 1; min-width: 0; }
.cr-ph b { display: block; font-size: 14px; font-weight: 500; line-height: 1.3; } .cr-ph small { display: block; font-size: 12px; color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cr-chip { flex: none; display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 9px; border-radius: 11px; font-size: 11.5px; font-weight: 500; background: var(--surface-3); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* ---------- find: invite people whose agents say they could fit (counts only, never names) ---------- */
  function kpi(l, v, h) { return '<div class="kpi"><span class="lbl">' + l + '</span><span class="val">' + esc(v) + '</span><span class="hint">' + h + '</span></div>'; }

  // A split of a group whose size is shown. Under 5 reads "fewer than 5"; and when only one count is hidden, the largest

  function groupCells(cells, dropZero) {
    cells = cells.filter(function (c) { return !dropZero || c[1]; });

  }
  function findView() {

      (P.invited.length ? '<div><h3 style="font-size:16px">Sent so far</h3><div class="plist">' + prow('Invited', cnt(P.invited.length)) + prow('Applied', String(yes)) + prow('Not applied yet', cnt(waiting.length)) + '</div><p class="faint xs" style="margin-top:8px">Last sent ' + ago(last.inv.at) + ' by ' + esc(last.inv.by) + '.' + (yes ? ' <button class="btn text" style="height:auto;padding:0;font-size:12px" data-act="go-rank" data-id="' + tid + '">Rank who applied</button>' : '') + '</p></div>' : '') + '</div>';

      '<p class="note">Counts only include people who allow invitations, and leave out anyone on another trial or who passed on this one. Under 5 shows as “fewer than 5”. Saying no is private. All patients are synthetic.</p>';

  function sendInvites() {

  /* ---------- rank: binary insertion, one swipe per comparison ---------- */
  function rstate(tid) { var r = Store.get('rankings', tid); return r ? clone(r) : { ranked: [], rejected: [], cur: null, n: 0 }; }
  function isOpen(id, tid) { var a = Store.get('apps', id); return a && a.trial === tid && a.stage === 'applied'; }
  function rqueue(tid, r) { return Store.all('apps').filter(function (a) { return a.trial === tid && a.stage === 'applied' && r.ranked.indexOf(a.id) < 0 && r.rejected.indexOf(a.id) < 0 && !(r.cur && r.cur.item === a.id); }).sort(function (a, b) { return a.at - b.at; }); }

  function remaining(tid, r) { var q = rqueue(tid, r).length, L = r.ranked.length, n = 0; if (r.cur) { n += Math.ceil(Math.log2(r.cur.hi - r.cur.lo + 1)); L++; } for (var i = 0; i < q; i++) { n += Math.ceil(Math.log2(L + 1)); L++; } return n; }
  function nearTxt(s) { return s.d < 5 ? 'near ' + esc(s.name) : s.d + ' mi to ' + esc(s.name); }

  function rankView() {

      '<div class="card" style="display:flex;flex-direction:column;gap:16px"><h3>Invite to pre-screening</h3><p class="muted sm">The top applicants get an invitation and agree to share their identity. The rest go on the waiting list and hear that straight away.</p><label class="field"><span>How many to invite</span><input class="input" id="topn" type="number" min="1" max="' + r.ranked.length + '" value="' + n + '" data-act="topn"></label><button class="btn pri big" data-act="invite">Invite the top ' + n + '</button></div></div>';

  function invitedNote(tid) { var n = Store.all('apps').filter(function (a) { return a.trial === tid && a.stage === 'prescreen'; }).length; return n ? '<p class="muted sm">' + plural(n, 'applicant is', 'applicants are') + ' in pre-screening for this trial. <button class="btn text" data-act="need" data-v="apps" data-id="prescreen">Open applications</button></p>' : ''; }

  /* ---------- applications pipeline ---------- */

    'send-invites': sendInvites,
    'go-find': function (el) { S.ctab = 'find'; S.trial = el.dataset.id; saveSession(); render(); window.scrollTo(0, 0); },
    'go-rank': function (el) { S.ctab = 'rank'; S.trial = el.dataset.id; saveSession(); render(); window.scrollTo(0, 0); },
    need: function (el) { if (el.dataset.v === 'rank' || el.dataset.v === 'find') { S.ctab = el.dataset.v; S.trial = el.dataset.id; } else { S.ctab = 'apps'; S.afilter = el.dataset.id; S.atrial = 'all'; } saveSession(); render(); window.scrollTo(0, 0); },
    'goto-trial': function (el) { S.ctab = 'apps'; S.atrial = el.dataset.id; S.afilter = 'all'; saveSession(); render(); window.scrollTo(0, 0); },
    rank: function (el) { rankDecide(el.dataset.v); },
    invite: invite,
    app: function (el) { openApp(el.dataset.id); },
    afilter: function (el) { S.afilter = el.dataset.v; render(); },
    stage: function (el) { var a = Store.get('apps', el.dataset.id), v = el.dataset.v; setStage(a, v, clinName(), v === 'rejected' ? { reason: 'Not the right fit for this trial' } : null); if (v === 'rejected') setTimeout(function () { runAgent(a.pid); }, 0); toast(STAGE_C[v] + '. The patient has been told.'); openApp(a.id); },
    sfail: function (el) { var a = Store.get('apps', el.dataset.id); setStage(a, 'screenfail', clinName(), { reason: 'Did not meet a requirement at screening' }); setTimeout(function () { runAgent(a.pid); }, 0); openApp(a.id); },
    enrol: function (el) { if (!($('#ok-consent') || {}).checked || !($('#ok-pi') || {}).checked) { toast('Tick both boxes first.'); return; } var a = Store.get('apps', el.dataset.id); setStage(a, 'enrolled', clinName(), { arm: Math.random() < .5 ? 'New treatment' : 'Standard treatment' }); toast('Enrolled and randomised.'); openApp(a.id); },
    'ps-save': function (el) { savePrescreen(el.dataset.id); },
    complete: function (el) { complete(el.dataset.id); }
  };
  function markRead() { var pt = S.who && me(); if (!pt) return; Store.all('events').filter(function (e) { return e.pid === pt.id && e.notice && !e.read; }).forEach(function (e) { var id = Object.keys(Store.data.events).filter(function (k) { return Store.data.events[k] === e; })[0]; var c = clone(e); c.read = true; Store.put('events', id, c); }); }

  document.addEventListener('click', function (e) {
    var sc = $('#scrim'); if (sc && e.target === sc) { closeSheet(); return; }
    var el = e.target.closest('[data-act]'); if (!el || el.tagName === 'SELECT' || el.type === 'checkbox' || el.type === 'number') return;
    var f = ACT[el.dataset.act]; if (f) { e.preventDefault(); f(el); }
  });
  document.addEventListener('change', function (e) {
    var el = e.target;
    if (el.id === 'rank-trial' || el.id === 'find-trial') { S.trial = el.value; S.topN = null; S.fwho = null; saveSession(); render(); }
    else if (el.id === 'apps-trial') { S.atrial = el.value; render(); }
    else if (el.id === 'auto-sw') ACT.auto(el);
    else if (el.id === 'topn') { S.topN = Number(el.value); render(); }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && S.sheet) { closeSheet(); return; }
    if (S.sheet || /INPUT|SELECT|TEXTAREA/.test((document.activeElement || {}).tagName || '')) return;
    if (!$('#deck .top') || $('#deck .top').dataset.kind === 'q') return;
    if (e.key === 'ArrowRight') { e.preventDefault(); fly('up'); } else if (e.key === 'ArrowLeft') { e.preventDefault(); fly('down'); }
  });

  render();
  Store.init();
  if (window.TMConnect) window.TMConnect.ready.then(soon);   // show live connections once the server has answered
})();
</script>
</body>
