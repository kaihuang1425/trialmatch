<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Local-first: the page may only talk to this computer (an optional MedGemma server on localhost). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; connect-src http://localhost:* http://127.0.0.1:*; base-uri 'none'; form-action 'none'">
<title>Trial Match</title>
<style>
/* Trial Match. Dark, Gemini-like. Clinicians get a wide workspace (Overview, Review, Applications); patients get one calm
   column (Home, My trials, My health, Inbox). Surfaces step up in tone instead of using borders; the blue-violet gradient
   appears only where the agent speaks. No gestures: every decision is an explicit, labelled button. */
:root {
  --bg: #131314; --surface: #1E1F20; --surface-2: #282A2C; --surface-3: #333537; --hover: #37393B;
  --ink: #E3E3E3; --muted: #C4C7C5; --faint: #8E918F; --line: #444746;
  --accent: #A8C7FA; --accent-ink: #062E6F; --accent-soft: #004A77; --on-soft: #C2E7FF;
  --met: #6DD58C; --met-soft: rgba(109,213,140,.14); --not: #F2B8B5; --not-soft: rgba(242,184,181,.14); --unk: #FDD663; --unk-soft: rgba(253,214,99,.13);
  --g1: #4285F4; --g2: #9B72CB; --g3: #D96570;
  --grad: linear-gradient(90deg, var(--g1), var(--g2) 55%, var(--g3));
  --grad-soft: linear-gradient(135deg, rgba(66,133,244,.16), rgba(155,114,203,.12) 55%, rgba(217,101,112,.08));
  --sans: "Google Sans Flex", "Google Sans", Roboto, "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace;
  --r-sm: 8px; --r: 16px; --r-lg: 24px; --r-xl: 28px;
  color-scheme: dark;
}
html, body { min-height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
h1, h2, h3 { margin: 0; font-weight: 400; text-wrap: balance; }
p { margin: 0; }
a { color: var(--accent); }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); font-size: .92em; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.sm { font-size: 14px; }
.xs { font-size: 12px; }
.grad-text { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
svg { flex: none; width: 20px; height: 20px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* top bar */
.bar { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
.bar-in { display: flex; align-items: center; gap: 16px; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); max-width: 1240px; margin: 0 auto; }
.logo { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 500; white-space: nowrap; }
.logo svg { width: 28px; height: 28px; }
.logo small { font-size: 12px; color: var(--faint); font-weight: 400; border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; }
.nav { display: flex; gap: 4px; margin-left: 8px; }
.nav button { height: 40px; padding: 0 16px; border-radius: 20px; color: var(--muted); font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; gap: 8px; position: relative; }
.nav button:hover { background: var(--surface-2); color: var(--ink); }
.nav button[aria-current="page"] { background: var(--accent-soft); color: var(--on-soft); }
.badge { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--g3); color: #fff; font-size: 11px; font-weight: 700; display: inline-grid; place-items: center; }
.spacer { flex: 1; }
.local { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 16px; background: var(--met-soft); color: var(--met); font-size: 12.5px; font-weight: 500; white-space: nowrap; }
.local svg { width: 15px; height: 15px; }
.me { display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 6px 0 14px; border-radius: 20px; background: var(--surface); font-size: 14px; }
.me:hover { background: var(--surface-2); }
.avatar { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 500; color: #fff; background: linear-gradient(135deg, var(--g1), var(--g2)); flex: none; }
.avatar.clin { background: linear-gradient(135deg, #1E8E3E, #4285F4); }
.bnav { display: none; }
@media (max-width: 860px) {
  .nav, .me .who, .bar .local span { display: none; }
  .local { padding: 0 9px; }
  .bnav { display: flex; position: fixed; z-index: 25; left: 0; right: 0; bottom: 0; background: var(--surface); padding: 8px max(8px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); justify-content: space-around; }
  .bnav button { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; font-weight: 500; color: var(--muted); flex: 1; position: relative; }
  .bnav button span.ic { width: 56px; height: 32px; border-radius: 16px; display: grid; place-items: center; }
  .bnav button[aria-current="page"] { color: var(--ink); }
  .bnav button[aria-current="page"] span.ic { background: var(--accent-soft); color: var(--on-soft); }
  .bnav .badge { position: absolute; top: -2px; left: 54%; }
  main { padding-bottom: 104px !important; }
}
@media (max-width: 560px) { .logo small { display: none; } .bar-in { gap: 10px; } .me { padding: 0 5px; } }

main { max-width: 1240px; margin: 0 auto; padding: 8px max(16px, env(safe-area-inset-right, 0px)) 64px max(16px, env(safe-area-inset-left, 0px)); }
.col { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
.wide { display: flex; flex-direction: column; gap: 24px; }
.page-h { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding-top: 16px; }
.page-h h1 { font-size: clamp(28px, 4.4vw, 36px); line-height: 1.2; }
.page-h p { color: var(--muted); margin-top: 6px; }
.hello { font-size: clamp(32px, 6vw, 44px); line-height: 1.15; padding-top: 20px; }
.sub { color: var(--muted); font-size: 18px; margin-top: 8px; }
.sect-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.sect-h h2 { font-size: 20px; }

/* buttons */
.btn { height: 40px; padding: 0 20px; border-radius: 20px; font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: var(--surface-3); color: var(--ink); white-space: nowrap; transition: background .15s, filter .15s; }
.btn:hover { background: var(--hover); }
.btn.pri { background: var(--accent); color: var(--accent-ink); }
.btn.pri:hover { filter: brightness(1.08); }
.btn.tonal { background: var(--accent-soft); color: var(--on-soft); }
.btn.tonal:hover { filter: brightness(1.15); }
.btn.out { background: transparent; box-shadow: inset 0 0 0 1px var(--line); color: var(--accent); }
.btn.out:hover { background: var(--surface-2); }
.btn.text { background: transparent; color: var(--accent); padding: 0 12px; }
.btn.text:hover { background: var(--surface-2); }
.btn.danger { background: transparent; box-shadow: inset 0 0 0 1px var(--line); color: var(--not); }
.btn.big { height: 52px; padding: 0 28px; border-radius: 26px; font-size: 16px; }
.btn:disabled { opacity: .38; pointer-events: none; }
.btn svg { width: 18px; height: 18px; }
.iconbtn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); }
.iconbtn:hover { background: var(--surface-2); color: var(--ink); }
.iconbtn svg { width: 22px; height: 22px; }
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.row.end { justify-content: flex-end; }

/* surfaces */
.card { background: var(--surface); border-radius: var(--r-lg); padding: 20px; min-width: 0; }
.card.pad-lg { padding: 24px; }
.card h3 { font-size: 18px; }
.list { display: flex; flex-direction: column; gap: 2px; border-radius: var(--r-lg); overflow: hidden; }
.item { background: var(--surface); padding: 16px 20px; display: flex; align-items: center; gap: 16px; text-align: left; width: 100%; min-width: 0; }
button.item:hover, .item.click:hover { background: var(--surface-2); }
.item .grow { flex: 1; min-width: 0; }
.item b { font-weight: 500; display: block; }
.item small { color: var(--muted); font-size: 14px; display: block; }
.ic-circle { width: 40px; height: 40px; border-radius: 50%; background: var(--surface-3); color: var(--muted); display: grid; place-items: center; flex: none; }
.ic-circle.ag { background: var(--grad-soft); color: var(--on-soft); }
.ic-circle.hu { background: var(--met-soft); color: var(--met); }
.chev { color: var(--faint); width: 20px; height: 20px; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 8px; font-size: 13px; font-weight: 500; background: var(--surface-3); color: var(--muted); white-space: nowrap; }
.chip.met { background: var(--met-soft); color: var(--met); }
.chip.not { background: var(--not-soft); color: var(--not); }
.chip.unk { background: var(--unk-soft); color: var(--unk); }
.chip.acc { background: var(--accent-soft); color: var(--on-soft); }
.chip.byagent { background: var(--grad-soft); color: var(--ink); }
.chip svg { width: 14px; height: 14px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--g1); display: inline-block; flex: none; }
.empty { text-align: center; padding: 40px 20px; color: var(--muted); }
.empty h3 { color: var(--ink); font-size: 20px; margin-bottom: 8px; }
.note { font-size: 13px; color: var(--faint); line-height: 1.5; }
.banner { background: var(--unk-soft); color: var(--unk); border-radius: var(--r); padding: 10px 14px; font-size: 13px; }

/* the agent (the one gradient surface) */
.agent { position: relative; border-radius: var(--r-xl); padding: 24px; background: var(--grad-soft), var(--surface); display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.agent::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; background: linear-gradient(135deg, rgba(66,133,244,.55), rgba(155,114,203,.35), rgba(217,101,112,.2)); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none; }
.agent-top { display: flex; gap: 12px 16px; align-items: center; flex-wrap: wrap; }
.agent-top .grow { flex: 1 1 220px; min-width: 0; }
@media (max-width: 560px) { .agent { padding: 18px; } .agent-top .llm { order: 3; } }
.spark { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(from 200deg, var(--g1), var(--g2), var(--g3), var(--g1)); position: relative; flex: none; }
.spark::after { content: ""; position: absolute; inset: 2px; border-radius: 50%; background: var(--surface); }
.spark svg { position: relative; z-index: 1; width: 22px; height: 22px; color: var(--accent); }
.spark.live { animation: spin 6s linear infinite; }
.spark.live svg { animation: spin 6s linear infinite reverse; }
.spark.sm { width: 30px; height: 30px; } .spark.sm svg { width: 15px; height: 15px; }
@keyframes spin { to { transform: rotate(360deg); } }
.agent-top h2 { font-size: 20px; line-height: 1.3; }
.agent-top p { color: var(--muted); font-size: 14px; }
.llm { height: 32px; padding: 0 12px; border-radius: 16px; background: var(--surface-2); font-size: 12.5px; font-weight: 500; color: var(--muted); white-space: nowrap; }
.llm.on { background: var(--met-soft); color: var(--met); }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--surface-2); border-radius: 20px; min-height: 48px; padding: 8px 8px 8px 16px; font-size: 14px; }
.toggle b { font-weight: 500; display: block; }
.toggle small { color: var(--muted); display: block; font-size: 13px; }
.switch { appearance: none; -webkit-appearance: none; width: 52px; height: 32px; border-radius: 16px; background: var(--surface-3); box-shadow: inset 0 0 0 2px var(--faint); position: relative; cursor: pointer; margin: 0; flex: none; transition: background .2s; }
.switch::after { content: ""; position: absolute; top: 8px; left: 8px; width: 16px; height: 16px; border-radius: 50%; background: var(--faint); transition: all .2s; }
.switch:checked { background: var(--accent); box-shadow: none; }
.switch:checked::after { top: 4px; left: 24px; width: 24px; height: 24px; background: var(--accent-ink); }
.chat { display: flex; flex-direction: column; gap: 16px; }
.msg.user { align-self: flex-end; background: var(--surface-3); border-radius: 18px 18px 4px 18px; padding: 10px 16px; max-width: 85%; }
.msg.agent { display: flex; flex-direction: column; gap: 10px; }
.msg.agent > p { font-size: 15.5px; }
.msg.agent ul { margin: 0; padding-left: 20px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; font-size: 15px; }
.msg.notice { background: var(--surface); border-radius: var(--r); padding: 14px 16px; }
.msg .by { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 500; color: var(--faint); }
.msg.model > p { white-space: pre-wrap; }
.msg.pending p { color: var(--faint); }
.dots::after { content: ""; display: inline-block; width: 1.2em; text-align: left; animation: dots 1.2s steps(4) infinite; }
@keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
.suggest { display: flex; gap: 8px; flex-wrap: wrap; }
.sug { min-height: 34px; padding: 6px 14px; line-height: 1.35; max-width: 100%; border-radius: 17px; box-shadow: inset 0 0 0 1px var(--line); font-size: 13.5px; color: var(--muted); text-align: left; }
.sug:hover { background: var(--surface-2); color: var(--ink); }
.ask { display: flex; gap: 8px; align-items: center; background: var(--surface-2); border-radius: 28px; padding: 6px 6px 6px 20px; }
.ask input { flex: 1; min-width: 0; height: 44px; background: none; border: 0; font-size: 16px; }
.ask input:focus { outline: none; }
.ask:focus-within { box-shadow: inset 0 0 0 2px var(--accent); }
.ask .send { width: 44px; height: 44px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
.ask .send:disabled { opacity: .4; }

/* question card */
.qcard { border-radius: var(--r-xl); background: var(--surface); padding: 24px; display: flex; flex-direction: column; gap: 16px; }
.qcard .from { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
.qt { font-size: 24px; line-height: 1.3; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { min-height: 52px; border-radius: var(--r); background: var(--surface-2); padding: 12px 18px; text-align: left; font-size: 15px; display: flex; align-items: center; gap: 12px; }
.opt:hover { background: var(--hover); }

/* trial cards */
.tcard { background: var(--surface); border-radius: var(--r-xl); padding: 22px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.tc-photo { width: 100%; height: 132px; object-fit: cover; border-radius: var(--r); display: block; opacity: .92; }
.tc-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.code { font-size: 13px; color: var(--faint); margin-top: 8px; }
.tc-title { font-size: clamp(20px, 4vw, 24px); line-height: 1.25; }
.tc-plain { font-size: 15px; }
.tc-facts { display: flex; flex-direction: column; gap: 8px; font-size: 14px; color: var(--muted); background: var(--surface-2); border-radius: var(--r); padding: 14px 16px; }
.tc-facts span { display: flex; gap: 10px; align-items: center; }
.tc-facts svg { width: 18px; height: 18px; color: var(--accent); }
.why { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; font-size: 15px; }
.why li { display: flex; gap: 10px; align-items: flex-start; }
.why svg { width: 18px; height: 18px; color: var(--met); margin-top: 2px; }
.tbc { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--unk); }
.tbc svg { width: 18px; height: 18px; }
.ring { position: relative; width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; flex: none; --c: var(--met); }
.ring.possible { --c: var(--unk); }
.ring.not { --c: var(--not); }
.ring::before { content: ""; position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(var(--c) var(--deg), var(--surface-3) 0); -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 4px)); mask: radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 4px)); }
.ring span { font-size: 17px; font-weight: 500; font-variant-numeric: tabular-nums; }
.ring span small { font-size: 11px; color: var(--faint); }
.trow { display: flex; gap: 16px; align-items: center; background: var(--surface); padding: 18px 20px; text-align: left; width: 100%; }
.trow:hover { background: var(--surface-2); }
.trow .grow { flex: 1; min-width: 0; }
.trow h3 { font-size: 17px; font-weight: 500; line-height: 1.35; }
.trow .meta { display: flex; gap: 6px 14px; flex-wrap: wrap; color: var(--muted); font-size: 13px; margin-top: 6px; }
.steps { display: flex; gap: 4px; margin-top: 12px; }
.steps i { flex: 1; height: 4px; border-radius: 2px; background: var(--surface-3); }
.steps i.done { background: var(--accent); }
.steps i.now { background: linear-gradient(90deg, var(--g1), var(--g2)); }
.steps i.bad { background: var(--not); }

/* segmented + filter chips */
.seg { display: inline-flex; border-radius: 20px; box-shadow: inset 0 0 0 1px var(--line); overflow: hidden; flex-wrap: wrap; }
.seg button { height: 40px; padding: 0 16px; font-size: 14px; font-weight: 500; color: var(--muted); }
.seg button + button { box-shadow: inset 1px 0 0 var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--on-soft); }
.fchip { height: 34px; padding: 0 14px; border-radius: 8px; box-shadow: inset 0 0 0 1px var(--line); font-size: 14px; font-weight: 500; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.fchip:hover { background: var(--surface-2); }
.fchip[aria-pressed="true"] { background: var(--accent-soft); color: var(--on-soft); box-shadow: none; }
.fchip .n { font-size: 12px; opacity: .8; }

/* fields */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > span { font-size: 13px; color: var(--muted); font-weight: 500; }
.input { height: 48px; border-radius: 12px; background: var(--surface-2); border: 0; padding: 0 14px; font-size: 16px; width: 100%; box-shadow: inset 0 0 0 1px transparent; }
.input:focus { outline: none; box-shadow: inset 0 0 0 2px var(--accent); }
select.input { appearance: none; -webkit-appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 20px) 21px, calc(100% - 15px) 21px; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 36px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
@media (max-width: 640px) { .grid2, .grid4 { grid-template-columns: 1fr 1fr; } }
input[type="checkbox"]:not(.switch) { width: 18px; height: 18px; accent-color: var(--accent); flex: none; }
.checkrow { display: flex; gap: 12px; align-items: flex-start; font-size: 14px; }
.checkrow input { margin-top: 2px; }

/* sheet */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.6); display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); width: min(640px, 100%); max-height: min(90vh, 940px); overflow: auto; border-radius: var(--r-xl) var(--r-xl) 0 0; padding: 8px max(20px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 18px; animation: up .22s ease-out; }
.sheet.wide { width: min(880px, 100%); }
@media (min-width: 861px) { .scrim { align-items: center; padding: 24px; } .sheet { border-radius: var(--r-xl); padding: 8px 28px 28px; } }
@keyframes up { from { transform: translateY(24px); opacity: 0; } }
.sheet-h { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; position: sticky; top: -8px; background: var(--surface); padding-top: 16px; padding-bottom: 4px; z-index: 1; }
.sheet-h h2 { font-size: 22px; line-height: 1.3; }
.handle { width: 32px; height: 4px; border-radius: 2px; background: var(--line); margin: 6px auto 0; }
@media (min-width: 861px) { .handle { display: none; } }
.panel2 { background: var(--surface-2); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.panel2 b { font-weight: 500; }
.bul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-size: 15px; color: var(--muted); }
.share { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; border-radius: var(--r); overflow: hidden; }
.share li { display: flex; justify-content: space-between; gap: 14px; background: var(--surface-2); padding: 10px 16px; font-size: 14px; }
.share li span:last-child { color: var(--muted); text-align: right; }

/* rule list (every rule, with its source) */
.rules { display: flex; flex-direction: column; gap: 2px; border-radius: var(--r); overflow: hidden; }
.rule { display: flex; gap: 12px; align-items: flex-start; background: var(--surface-2); padding: 12px 16px; font-size: 14px; }
.rule .mk { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; flex: none; margin-top: 1px; }
.rule .mk.met { background: var(--met-soft); color: var(--met); }
.rule .mk.not { background: var(--not-soft); color: var(--not); }
.rule .mk.unk { background: var(--unk-soft); color: var(--unk); }
.rule .grow { flex: 1; min-width: 0; }
.rule small { display: block; color: var(--faint); font-size: 12.5px; margin-top: 3px; }
.rule small b { font-weight: 500; color: var(--muted); }
.vd { display: flex; gap: 6px; margin-top: 8px; }
.vd button { height: 28px; padding: 0 12px; border-radius: 14px; font-size: 12.5px; font-weight: 500; box-shadow: inset 0 0 0 1px var(--line); color: var(--muted); }
.vd button[aria-pressed="true"].y { background: var(--met-soft); color: var(--met); box-shadow: none; }
.vd button[aria-pressed="true"].n { background: var(--not-soft); color: var(--not); box-shadow: none; }

/* activity feed */
.feed { display: flex; flex-direction: column; gap: 14px; }
.ev { display: flex; gap: 12px; align-items: flex-start; font-size: 14px; }
.ev .av { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-3); color: var(--muted); flex: none; }
.ev .av svg { width: 15px; height: 15px; }
.ev b { font-weight: 500; }
.ev time { color: var(--faint); font-size: 12px; margin-left: 6px; }

/* toast */
.toast { position: fixed; z-index: 60; left: 50%; top: calc(16px + env(safe-area-inset-top, 0px)); transform: translate(-50%, -12px); opacity: 0; transition: all .25s; background: #E3E3E3; color: #1F1F1F; border-radius: 8px; padding: 12px 16px; font-size: 14px; width: max-content; max-width: min(480px, calc(100% - 32px)); box-shadow: 0 4px 16px rgba(0,0,0,.4); pointer-events: none; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* health */
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
.stat { background: var(--surface); border-radius: var(--r-lg); padding: 16px 18px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.stat .lbl { font-size: 13px; color: var(--muted); }
.stat .val { font-size: 26px; line-height: 1.2; font-variant-numeric: tabular-nums; }
.stat .src { font-size: 12px; color: var(--faint); }
.stat.unknown .val { color: var(--faint); font-size: 18px; padding-top: 6px; }
.dx { display: flex; flex-direction: column; gap: 12px; }
.dx h2 { font-size: 24px; line-height: 1.3; }

/* landing */
.login { min-height: 100vh; display: grid; place-items: center; padding: 32px max(16px, env(safe-area-inset-right, 0px)) 32px max(16px, env(safe-area-inset-left, 0px)); background: radial-gradient(ellipse 80% 50% at 50% -10%, rgba(66,133,244,.16), transparent 70%), var(--bg); }
.login-box { width: min(480px, 100%); display: flex; flex-direction: column; gap: 24px; }
.login-box .logo { font-size: 24px; }
.login-box h1 { font-size: 36px; line-height: 1.2; }
.acct { display: flex; align-items: center; gap: 14px; background: var(--surface); padding: 14px 18px; text-align: left; width: 100%; }
.acct:hover { background: var(--surface-2); }
.acct .grow { flex: 1; min-width: 0; }
.acct b { font-weight: 500; display: block; }
.acct small { color: var(--muted); font-size: 13px; }
.points { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.point { background: var(--surface); border-radius: var(--r); padding: 12px 14px; font-size: 13px; color: var(--muted); display: flex; gap: 10px; align-items: flex-start; }
.point svg { width: 18px; height: 18px; color: var(--accent); margin-top: 1px; }
.point b { color: var(--ink); font-weight: 500; display: block; }

/* clinician */
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
@media (max-width: 900px) { .kpis { grid-template-columns: repeat(2, 1fr); } }
.kpi { background: var(--surface); border-radius: var(--r-lg); padding: 18px 20px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.kpi .lbl { font-size: 13px; color: var(--muted); }
.kpi .val { font-size: 34px; line-height: 1.2; font-variant-numeric: tabular-nums; }
.kpi .hint { font-size: 12px; color: var(--faint); }
.two { display: grid; grid-template-columns: 1.1fr 1fr; gap: 16px; align-items: start; }
@media (max-width: 900px) { .two { grid-template-columns: 1fr; } }
.funnel { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
.frow { display: grid; grid-template-columns: 110px 1fr 36px; gap: 12px; align-items: center; font-size: 14px; }
.frow .track { height: 10px; border-radius: 5px; background: var(--surface-2); overflow: hidden; }
.frow .track i { display: block; height: 100%; border-radius: 5px; background: linear-gradient(90deg, var(--g1), var(--g2)); }
.frow b { font-weight: 500; text-align: right; font-variant-numeric: tabular-nums; }
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-weight: 500; color: var(--faint); font-size: 12px; padding: 0 12px 10px; white-space: nowrap; }
td { padding: 12px; border-top: 1px solid var(--surface-3); vertical-align: middle; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--surface-2); }
.trialpick { min-width: 0; max-width: 100%; }
.trialpick select { height: 40px; border-radius: 20px; padding-left: 16px; font-size: 14px; font-weight: 500; background-color: var(--surface-2); background-position: calc(100% - 20px) 17px, calc(100% - 15px) 17px; max-width: min(520px, 100%); }
.callout { border-radius: var(--r-lg); padding: 18px 20px; background: var(--surface); font-size: 15px; color: var(--muted); }
.callout b { color: var(--ink); font-weight: 500; }
.mini { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; width: 120px; margin-bottom: 4px; }
.mini i { display: block; height: 100%; background: linear-gradient(90deg, var(--g1), var(--g2)); }

/* review queue */
.review { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 960px) { .review { grid-template-columns: 1fr; } }
.queue { display: flex; flex-direction: column; gap: 2px; border-radius: var(--r-lg); overflow: hidden; }
.qrow { background: var(--surface); }
.qrow.open { background: var(--surface); box-shadow: inset 3px 0 0 var(--accent); }
.qhead { display: flex; gap: 14px; align-items: center; width: 100%; text-align: left; padding: 16px 18px; }
.qhead:hover { background: var(--surface-2); }
.pos { width: 32px; height: 32px; border-radius: 50%; background: var(--surface-3); display: grid; place-items: center; font-size: 14px; font-weight: 500; flex: none; }
.qrow.top .pos { background: var(--accent); color: var(--accent-ink); }
.qhead .grow { flex: 1; min-width: 0; }
.qhead b { font-weight: 500; display: block; }
.qhead small { color: var(--muted); font-size: 13.5px; display: block; }
.qbody { padding: 0 18px 18px 64px; display: flex; flex-direction: column; gap: 14px; }
@media (max-width: 640px) { .qbody { padding-left: 18px; } }
.facts { display: flex; flex-direction: column; gap: 8px; font-size: 14px; }
.facts div { display: grid; grid-template-columns: 96px 1fr; gap: 10px; }
.facts span.k { color: var(--faint); }
.stepper { display: flex; gap: 6px; flex-wrap: wrap; }
.stepper span { font-size: 12px; font-weight: 500; padding: 5px 10px; border-radius: 8px; background: var(--surface-2); color: var(--faint); }
.stepper span.done { color: var(--muted); }
.stepper span.now { background: var(--accent); color: var(--accent-ink); }
.stepper span.bad { background: var(--not-soft); color: var(--not); }
details > summary { cursor: pointer; color: var(--accent); font-size: 14px; font-weight: 500; list-style: none; }
details > summary::-webkit-details-marker { display: none; }
details[open] > summary { margin-bottom: 10px; }
textarea.log { width: 100%; min-height: 140px; font-family: var(--mono); font-size: 12px; background: var(--surface-2); color: var(--muted); border: 0; border-radius: 12px; padding: 12px; resize: vertical; }
.disc { font-size: 12px; color: var(--faint); text-align: center; max-width: 90ch; margin: 40px auto 0; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

      '<div class="chips"><span class="chip met">✓ ' + c.met + '</span>' + (c.not ? '<span class="chip not">✕ ' + c.not + '</span>' : '') + (c.unk ? '<span class="chip unk">? ' + c.unk + '</span>' : '') + '</div>' +
      '<div class="facts"><div><span class="k">Tumour</span><span>' + esc(factValue(p, 'histology') + ', ' + STAGE_TXT[p.stage]) + '<br>' + esc(bioText(p).join(' · ')) + '</span></div><div><span class="k">Treatment</span><span>' + esc(factValue(p, 'prior_lines')) + '</span></div><div><span class="k">Fitness</span><span>' + esc(factValue(p, 'ecog')) + '</span></div></div></div>' + act +
      '<details><summary>All ' + L.length + ' checked rules</summary>' + ruleList(sc, ['applied', 'prescreen', 'screening'].indexOf(a.stage) >= 0 ? key : null) + '</details>' +
      '<details><summary>History</summary><div class="feed">' + a.hist.slice().reverse().map(function (h) { return '<div class="ev"><span class="av">' + (/agent|Patient/.test(h.by) ? ICON.spark : ICON.hosp) + '</span><div><b>' + STAGE_C[h.s] + '</b><time>' + dstr(h.at) + ' ' + clock(h.at) + ' · ' + esc(h.by) + '</time>' + (h.note ? '<p class="muted">' + esc(h.note) + '</p>' : '') + '</div></div>'; }).join('') + '</div></details>', true);
  }
  function openSettings() {
    var team = S.who && S.who.role === 'team', pid = team ? null : S.who && S.who.id;
    sheet(sheetHead('What runs where', 'Trial Match is local-first: the rules come down, nothing about a patient goes up.') +
      '<div class="list"><div class="item"><span class="ic-circle">' + ICON.down + '</span><span class="grow"><b>Downloaded</b><small>The trial rules bundle: ' + TRIALS.length + ' recruiting phase 3 lung cancer trials from ClinicalTrials.gov (' + fmtDate(B.snapshot) + '), with eligibility rules already parsed. Public data, nothing about any patient.</small></span></div>' +
      '<div class="item"><span class="ic-circle">' + ICON.chip + '</span><span class="grow"><b>On this device</b><small>' + (team ? 'Applications you have received, the agent and the audit log.' : 'Your record, your answers, the matcher and your agent. Matching runs in this browser tab.') + ' The page’s security policy blocks every connection except to this computer.</small></span></div>' +
      '<div class="item"><span class="ic-circle">' + ICON.lock + '</span><span class="grow"><b>Shared only when chosen</b><small>' + (team ? 'A patient’s agent sends you only the facts your trial checks, under a record ID. Names come after consent.' : 'A trial team receives only the facts listed when you apply, and only that team. My health lists everything you’ve shared.') + '</small></span></div></div>' +
      (pid ? '<label class="toggle"><span><b>Apply for me</b><small>Your agent applies to strong matches and, if a team says no, sends you on to the next fit.</small></span><input type="checkbox" class="switch" id="auto-sw2" data-act="auto"' + (S.auto[pid] ? ' checked' : '') + ' aria-label="Apply for me"></label>' : '') +
      '<div class="panel2"><b>Optional: MedGemma on this computer</b><p class="sm muted">Built-in answers come straight from the trial records. For free-form questions you can run Google’s MedGemma, an open medical model, on this computer with Ollama. Typed questions then go to it with the relevant trial facts. Nothing goes to an online service.</p>' +
      '<label class="toggle"><span><b>Answer typed questions with MedGemma</b><small>' + esc(S.llm.model) + ' at ' + esc(S.llm.url) + '</small></span><input type="checkbox" class="switch" id="llm-on" data-act="llm-on"' + (S.llm.on ? ' checked' : '') + ' aria-label="Use MedGemma"></label>' +
      '<div class="grid2"><label class="field"><span>Server</span><input class="input" id="llm-url" data-act="llm-cfg" value="' + esc(S.llm.url) + '" spellcheck="false"></label><label class="field"><span>Model</span><input class="input" id="llm-model" data-act="llm-cfg" value="' + esc(S.llm.model) + '" spellcheck="false"></label></div>' +
      '<div class="row"><button class="btn tonal" data-act="llm-test">Test connection</button><span class="sm muted" id="llm-out" aria-live="polite"></span></div>' +
      '<p class="note">Start it with: OLLAMA_ORIGINS=* ollama serve, then ollama pull medgemma1.5:4b. MedGemma is a developer model, not a medical device; its answers are drafts from the trial record and the trial team has the final word.</p></div>');
  }

  /* ---------- actions ---------- */
  function answer(f, v) {
    var pid = S.who.id, before = ranked(pid).n_possible;
    (S.answers[pid] = S.answers[pid] || {})[f] = v;
    logRow(pid, '', 'answer', f, v === 'untested' ? 'unknown' : v);
    save(); runAgent(pid); save();
    var d = before - ranked(pid).n_possible;
    toast(d > 0 ? plural(d, 'trial') + ' no longer fit' + (d === 1 ? 's' : '') + '.' : d < 0 ? plural(-d, 'more trial') + ' could now fit.' : 'Saved. Your matches are updated.');
    render();
  }
  function invite(a) { setStage(a, 'prescreen', teamName()); }
  function reject(a, reason) { setStage(a, 'rejected', teamName(), { reason: reason }); }
  function on(type, fn) { document.addEventListener(type, fn); }
  on('click', function (ev) {
    if (ev.target.id === 'scrim') { closeSheet(); return; }
    var el = ev.target.closest('[data-act]'); if (!el || el.disabled) return;
    if (el.tagName === 'SELECT' || (el.tagName === 'INPUT' && (el.type === 'checkbox' || el.type === 'number' || el.type === 'text'))) return;
    var act = el.dataset.act, id = el.dataset.id, v = el.dataset.v, a = id && S.apps[id];
    switch (act) {
      case 'login-role': S.loginRole = v; save(); render(); break;
      case 'showall': S.showAll = !S.showAll; save(); render(); break;
      case 'login': S.who = { role: el.dataset.role, id: id }; S.tab = 'home'; S.ctab = 'overview'; if (S.who.role === 'patient') runAgent(id); save(); render(); window.scrollTo(0, 0); break;
      case 'logout': S.who = null; closeSheet(); save(); render(); break;
      case 'reset': if (confirm('Reset the demo? This clears every application, answer and decision in this browser.')) { var keep = S.llm; S = fresh(); S.llm = keep; save(); seedDemo(); closeSheet(); render(); toast('Demo reset'); } break;
      case 'tab': S.tab = v; closeSheet(); save(); render(); window.scrollTo(0, 0); break;
      case 'ctab': S.ctab = v; S.open = null; closeSheet(); save(); render(); window.scrollTo(0, 0); break;
      case 'close': closeSheet(); break;
      case 'settings': openSettings(); break;
      case 'trial': openTrial(id); break;
      case 'apply': if (S.who.role === 'patient') openApply(id); break;
      case 'apply-send': var pid = S.who.id, fw = $('#fwd'); if (fw) S.auto[pid] = fw.checked; var na = createApp(pid, id, 'patient'); event(pid, 'agent', 'Filled in your application for ' + tn(id) + ' from your record and sent it' + (na.from ? ', after the ' + tn(na.from) + ' team said no' : '') + '. The team sees your record ID, not your name.'); S.events[S.events.length - 1].read = true; save(); closeSheet(); render(); toast('Applied to ' + tn(id) + '. You’ll hear back in your inbox.'); break;
      case 'pass': openPass(id); break;
      case 'pass-r': var pp = S.who.id; (S.passes[pp] = S.passes[pp] || {})[id] = PASS_REASONS[Number(v)]; logRow(pp, id, 'outcome', 'enrolment', 'declined', PASS_REASONS[Number(v)]); save(); closeSheet(); render(); toast('Removed from your matches. You can bring it back from the trial’s details.'); break;
      case 'unpass': delete (S.passes[S.who.id] || {})[id]; save(); closeSheet(); render(); break;
      case 'withdraw': if (a) { setStage(a, 'withdrawn', 'Patient'); closeSheet(); render(); toast('Application withdrawn.'); } break;
      case 'answer': answer(el.dataset.q, v); break;
      case 'skip': var ps = S.who.id; (S.qskip[ps] = S.qskip[ps] || []).push(el.dataset.q); (S.asks[ps] || []).forEach(function (x) { x.fields = x.fields.filter(function (f) { return f !== el.dataset.q; }); }); save(); render(); break;
      case 'unanswer': delete S.answers[S.who.id][el.dataset.q]; save(); render(); break;
      case 'mtab': S.mtab = v; save(); render(); break;
      case 'read': if (S.events[Number(id)]) S.events[Number(id)].read = true; save(); render(); break;
      case 'readall': S.events.forEach(function (e) { if (e.pid === S.who.id) e.read = true; }); save(); render(); break;
      case 'clearme': var pc = S.who.id; ['answers', 'qskip', 'chat', 'ctx', 'asks', 'told'].forEach(function (k) { delete S[k][pc]; }); save(); render(); toast('Your answers and chat are cleared from this device. Applications you sent stay with those teams.'); break;
      case 'chip': send(v, true); break;
      case 'askall': allApps().filter(function (x) { return x.nct === id && x.stage === 'applied'; }).forEach(function (x) { var f = askable(x.pid, scoreOf(x.pid, id)); if (f.length) askFor(x, f); }); save(); render(); toast('Asked the applicants’ agents for the missing details.'); break;
      case 'review': S.ctab = 'review'; S.trial = id; S.open = null; S.failing = null; closeSheet(); save(); render(); window.scrollTo(0, 0); break;
      case 'need': S.ctab = v; if (v === 'review') S.trial = id; else { S.afilter = id === 'all' ? 'all' : id; S.atrial = 'all'; } save(); render(); window.scrollTo(0, 0); break;
      case 'qopen': S.open = S.open === id ? null : id; S.failing = null; save(); render(); break;
      case 'verdict': var vk = S.verdicts[id] = S.verdicts[id] || {}, f = el.dataset.f; if (vk[f] === v) delete vk[f]; else { vk[f] = v; logRow(id.split('|')[0], id.split('|')[1], 'criterion', f, v); } save(); render(); if ($('#scrim') && S.apps[id] && S.ctab !== 'review') openApp(id); break;
      case 'invite1': if (a) { invite(a); S.open = null; save(); render(); toast('Invited ' + a.pid + ' to pre-screening. Their agent has told them.'); } break;
      case 'ask': if (a) { var af = askable(a.pid, scoreOf(a.pid, a.nct)); askFor(a, af); save(); render(); toast('Asked ' + a.pid + '’s agent for: ' + af.map(function (x) { return NAMES[x].toLowerCase(); }).join(', ') + '.'); } break;
      case 'fail-open': S.failing = id; save(); render(); break;
      case 'fail-cancel': S.failing = null; save(); render(); break;
      case 'reject': if (a) { var rs = $('#fail-reason') ? $('#fail-reason').value : REASONS[0]; reject(a, rs); S.failing = null; S.open = null; save(); render(); var rr = S.reroutes.filter(function (x) { return x.pid === a.pid && x.from === a.nct; })[0]; toast(rr ? 'Marked not eligible. ' + a.pid + '’s agent sent them on to ' + tn(rr.to) + '.' : 'Marked not eligible. ' + a.pid + '’s agent has told them and is looking again.'); } break;
      case 'move': var qq = S.prio[S.trial] || [], i = qq.indexOf(id), j = v === 'up' ? i - 1 : i + 1; if (i >= 0 && j >= 0 && j < qq.length) { qq[i] = qq[j]; qq[j] = id; logRow(id.split('|')[0], S.trial, 'priority', 'order', v, 'Moved by the trial team'); } save(); render(); break;
      case 'invite-top': var qs = queue(S.trial), n = Math.max(1, Math.min(qs.length, Number(($('#topn') || {}).value) || 3)), invited = 0, skipped = 0;
        qs.forEach(function (x, k) { var no = crit(scoreOf(x.pid, x.nct)).some(function (l) { return l.by === 'team' && l.status === 'not_met'; }); if (k < n && !no) { invite(x); invited++; } else if (no) skipped++; else setStage(x, 'waitlist', teamName(), { rank: k + 1 }); });
        S.open = null; save(); toast('Invited ' + plural(invited, 'applicant') + ' to pre-screening' + (skipped ? ', skipped ' + skipped + ' with a rule not met' : '') + '. Everyone has been told.'); S.ctab = 'apps'; S.afilter = 'prescreen'; S.atrial = S.trial; save(); render(); break;
      case 'app': openApp(id); break;
      case 'afilter': S.afilter = v; save(); render(); break;
      case 'stage': if (a) { if (v === 'rejected') reject(a, 'Not eligible at review'); else invite(a); render(); openApp(id); } break;
      case 'ps-save': if (a) {
        var now = Date.now(), src = 'Pre-screening, ' + (T[a.nct].site_name || 'trial site') + ', ' + dstr(now), cl = S.clin[a.pid] = S.clin[a.pid] || {};
        var ec = $('#ps-ecog').value, pd = $('#ps-pdl1').value, br = $('#ps-brain').value, ln = $('#ps-lines').value;
        if (ec !== '') cl.ecog = Number(ec); if (pd !== '') cl.pdl1 = Number(pd); if (br && br !== 'unknown') cl.brain_mets = br; if (ln !== '') cl.prior_lines = Number(ln); cl.src = src;
        ['ecog', 'pdl1', 'brain_mets', 'prior_lines'].forEach(function (k) { if (cl[k] != null) logRow(a.pid, '', 'answer', k, cl[k], src); });
        save();
        var fails = crit(scoreOf(a.pid, a.nct)).filter(function (l) { return l.status === 'not_met'; });
        event(a.pid, 'agent', 'Added your pre-screening results from ' + (T[a.nct].site_name || 'the trial site') + ' to your record.');
        if (fails.length) { setStage(a, 'screenfail', teamName(), { reason: fails.map(function (l) { return NAMES[l.field] + ' not met'; }).join('; ') }); toast('Saved. ' + a.pid + ' doesn’t meet: ' + NAMES[fails[0].field] + '. Their agent is looking again.'); }
        else { setStage(a, 'screening', teamName()); toast('Saved. ' + a.pid + ' moves to screening.'); }
        render(); openApp(id); } break;
      case 'enrol': if (a) { if (!$('#ok-consent').checked || !$('#ok-pi').checked) { toast('Tick both: signed consent and the principal investigator’s sign-off.'); break; } setStage(a, 'enrolled', teamName()); render(); openApp(id); toast(a.pid + ' is enrolled. Their agent pauses.'); } break;
      case 'sfail': if (a) { setStage(a, 'screenfail', teamName(), { reason: 'Did not meet a screening requirement' }); render(); openApp(id); } break;
      case 'complete': if (a) { setStage(a, 'completed', teamName(), { outcome: { br: $('#rs-br').value, months: Number($('#rs-months').value) || 0 } }); render(); openApp(id); toast('Completed. ' + a.pid + '’s agent is looking at what could come next.'); } break;
      case 'copylog': var ta = $('#logcsv'); (navigator.clipboard ? navigator.clipboard.writeText(csv()) : Promise.reject()).then(function () { toast('Log copied'); }, function () { if (ta) { ta.select(); } toast('Selected: press Ctrl+C to copy'); }); break;
      case 'llm-test': S.llm.url = ($('#llm-url') || {}).value || S.llm.url; S.llm.model = ($('#llm-model') || {}).value || S.llm.model; save(); var out = $('#llm-out'); out.textContent = 'Checking…';
        fetch(S.llm.url.replace(/\/+$/, '') + '/api/tags').then(function (r) { return r.json(); }).then(function (j) { var names = (j.models || []).map(function (m) { return m.name; }); out.textContent = names.indexOf(S.llm.model) >= 0 || names.indexOf(S.llm.model + ':latest') >= 0 ? 'Connected. ' + S.llm.model + ' is ready.' : 'Connected, but ' + S.llm.model + ' isn’t installed. Run: ollama pull ' + S.llm.model; })
          .catch(function () { out.textContent = 'Nothing answered at ' + S.llm.url + '. Start Ollama with OLLAMA_ORIGINS=* so this page can reach it.'; }); break;
    }
  });
  on('change', function (ev) {
    var el = ev.target, act = el.dataset && el.dataset.act; if (!act) return;
    if (act === 'auto') { var pid = S.who.id; S.auto[pid] = el.checked; save(); if (el.checked) runAgent(pid); save(); render(); if ($('#scrim')) openSettings(); toast(el.checked ? 'Your agent will apply to strong matches and keep you moving after a “no”.' : 'Your agent will ask you first.'); }
    else if (act === 'review-trial') { S.trial = el.value; S.open = null; save(); render(); }
    else if (act === 'apps-trial') { S.atrial = el.value; save(); render(); }
    else if (act === 'topn') { S.topN = Number(el.value); save(); render(); }
    else if (act === 'llm-on') { S.llm.on = el.checked; save(); render(); toast(el.checked ? 'Typed questions now go to MedGemma on this computer.' : 'Built-in answers only.'); }
    else if (act === 'llm-cfg') { S.llm.url = $('#llm-url').value.trim() || 'http://localhost:11434'; S.llm.model = $('#llm-model').value.trim() || 'medgemma1.5:4b'; save(); }
  });
  on('submit', function (ev) {
    var f = ev.target; if (!f.dataset || !f.dataset.form) return;
    ev.preventDefault();
    if (f.dataset.form === 'ask') { var i = $('#ask-in'); var v = i.value.trim(); i.value = ''; send(v, false); }
    else if (f.dataset.form === 'num') { var nv = $('#num-in').value; if (nv !== '') answer(f.dataset.q, nv); }
  });
  on('keydown', function (ev) { if (ev.key === 'Escape' && $('#scrim')) closeSheet(); });

  render();
})();
</script>
</body>
</html>
