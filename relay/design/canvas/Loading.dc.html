<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
body{margin:0;background:#141B18}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;margin:0;padding:0}
.stage{--bg:#141B18;--tile:#19231F;--bd:#26322D;--ln:#F6F3EB;--mut:#A9B5AF;--soft:#2B3833;--txt:#F6F3EB;min-height:1500px;padding:24px clamp(16px,3vw,40px) 48px;font-family:'DM Sans',system-ui,sans-serif;color:var(--txt);background:var(--bg);transition:background .4s ease,color .4s ease}
.stage.light{--bg:#F3F2EE;--tile:#FFFFFF;--bd:#E6E4DE;--ln:#12131C;--mut:#555A6E;--soft:#E6E4DE;--txt:#12131C}
.wrap{max-width:1200px;margin:0 auto}
.dsp{font-family:'Bricolage Grotesque','DM Sans',sans-serif;letter-spacing:-0.035em}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo{width:36px;height:36px;border-radius:11px;background:#26322D;display:grid;place-items:center}
.syn{font:500 10.5px/1.6 'JetBrains Mono',monospace;letter-spacing:.08em;color:var(--mut);border:1px dashed var(--mut);border-radius:6px;padding:0 6px}
.seg{margin-left:auto;display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--tile);border:1px solid var(--bd)}
.seg button{height:38px;padding:0 14px;border-radius:10px;font-size:14px;font-weight:600;color:var(--mut);transition:background .15s ease,color .15s ease}
.seg button[aria-pressed="true"]{background:var(--soft);color:var(--txt)}
.status{display:flex;align-items:center;gap:24px;flex-wrap:wrap;margin:30px 0 22px}
.step{font-size:44px;font-weight:700;line-height:1;flex:1;min-width:260px}
.sA{animation:stepA .45s cubic-bezier(.22,1,.36,1) both}.sB{animation:stepB .45s cubic-bezier(.22,1,.36,1) both}
.prog{display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.dots{display:flex;gap:6px}
.dot{width:30px;height:6px;border-radius:6px;background:var(--soft);transition:background .35s ease}
.dot.on{background:#FF5B2E}.dot.ok{background:#4CC38A}
.bar{width:260px;height:6px;border-radius:6px;background:var(--soft);overflow:hidden}
.bar span{display:block;height:100%;background:#FF5B2E;transition:width .2s linear,background .4s ease}
.bar.ok span{background:#4CC38A}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;grid-auto-flow:dense}
.tile{position:relative;display:flex;flex-direction:column;align-items:stretch;gap:6px;aspect-ratio:1;padding:14px 16px;border-radius:24px;background:var(--tile);border:1px solid var(--bd);text-align:left;transition:transform .22s cubic-bezier(.22,1,.36,1),box-shadow .22s ease,border-color .2s ease}
.tile:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(0,0,0,.18)}
.tile.sel{grid-column:span 2;grid-row:span 2;border-color:#FF5B2E;box-shadow:0 0 0 2px #FF5B2E inset}
.tile svg{flex:1;width:100%;min-height:0;overflow:visible}
.tname{font-size:16px;font-weight:700}
.tile.sel .tname{font-size:22px}
.ln{stroke:var(--ln)}.lnf{fill:var(--ln)}.mu{stroke:var(--mut)}.muf{fill:var(--mut)}
.lobe{transform-box:fill-box;transform-origin:50% 0;animation:breath 3.2s ease-in-out infinite}
.alv{animation:twinkle 3.2s ease-in-out infinite}
.alv2{animation-delay:.6s}.alv3{animation-delay:1.2s}
.focus{transform-box:fill-box;transform-origin:center;animation:focus 3.4s ease-in-out infinite}
.drift{transform-box:fill-box;transform-origin:center;animation:drift 12s linear infinite}
.rung{transform-origin:100px 100px;animation:twist 2.2s ease-in-out infinite}
.level{transform-box:fill-box;transform-origin:center bottom;animation:empty 4.8s ease-in-out infinite}
.drop{animation:fall 1.2s cubic-bezier(.5,0,.8,.6) infinite}
.halfL{animation:snapL 2.8s cubic-bezier(.65,0,.35,1) infinite}
.halfR{animation:snapR 2.8s cubic-bezier(.65,0,.35,1) infinite}
.spin{transform-origin:100px 100px;animation:spin180 2.8s cubic-bezier(.65,0,.35,1) infinite}
.rod{animation:push 3s cubic-bezier(.65,0,.35,1) infinite}
.dose{transform-box:fill-box;transform-origin:center bottom;animation:dose 3s cubic-bezier(.65,0,.35,1) infinite}
.tipdrop{animation:tip 3s ease-in infinite}
.ripple{transform-box:fill-box;transform-origin:center;animation:ripple 3s ease-out infinite}
.trace{stroke-dasharray:340;animation:draw 2.2s linear infinite}
.head{stroke-dasharray:6 600;animation:head 2.2s linear infinite}
.heart{transform-box:fill-box;transform-origin:center;animation:beat 1.1s cubic-bezier(.34,1.56,.64,1) infinite}
.cellL{transform-box:fill-box;transform-origin:center;animation:splitL 3s cubic-bezier(.65,0,.35,1) infinite}
.cellR{transform-box:fill-box;transform-origin:center;animation:splitR 3s cubic-bezier(.65,0,.35,1) infinite}
.wound{animation:heal 3.6s ease-in-out infinite}
.st{stroke-dasharray:30;stroke-dashoffset:30;animation:stitch 3.6s ease-out infinite}
.fill{transform-box:fill-box;transform-origin:center bottom;animation:pour 3.6s cubic-bezier(.65,0,.35,1) infinite}
.armT{animation:armT 3s cubic-bezier(.65,0,.35,1) infinite}.armB{animation:armB 3s cubic-bezier(.65,0,.35,1) infinite}.armL{animation:armL 3s cubic-bezier(.65,0,.35,1) infinite}.armR{animation:armR 3s cubic-bezier(.65,0,.35,1) infinite}
.crossg{transform-origin:100px 100px;animation:turn 3s cubic-bezier(.65,0,.35,1) infinite}
.orbit{transform-origin:100px 100px;animation:rot 6s linear infinite}
.orbit2{transform-origin:100px 100px;animation:rot 2.4s linear infinite reverse}
.core{transform-box:fill-box;transform-origin:center;animation:beat 2.4s ease-in-out infinite}
.d1{animation-delay:-.2s}.d2{animation-delay:-.4s}.d3{animation-delay:-.6s}.d4{animation-delay:-.8s}.d5{animation-delay:-1s}.d6{animation-delay:-1.2s}.d7{animation-delay:-1.4s}.d8{animation-delay:-1.6s}
.p1{animation-delay:.25s}.p2{animation-delay:.5s}.p3{animation-delay:.75s}.p4{animation-delay:1s}.p5{animation-delay:1.25s}
@keyframes breath{0%,100%{transform:scale(.93)}50%{transform:scale(1.06)}}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes focus{0%,100%{filter:blur(5px);transform:scale(1.05)}45%,65%{filter:blur(0);transform:scale(1)}}
@keyframes drift{to{transform:rotate(360deg)}}
@keyframes twist{0%,100%{transform:scaleX(1)}50%{transform:scaleX(-1)}}
@keyframes empty{0%,8%{transform:scaleY(1)}92%,100%{transform:scaleY(.25)}}
@keyframes fall{0%{transform:translateY(0);opacity:0}15%{opacity:1}80%{transform:translateY(24px);opacity:1}100%{transform:translateY(28px);opacity:0}}
@keyframes snapL{0%,100%{transform:translateX(-22px)}30%,70%{transform:translateX(0)}}
@keyframes snapR{0%,100%{transform:translateX(22px)}30%,70%{transform:translateX(0)}}
@keyframes spin180{0%,30%{transform:rotate(0)}70%,100%{transform:rotate(180deg)}}
@keyframes push{0%,10%{transform:translateY(0)}75%,100%{transform:translateY(62px)}}
@keyframes dose{0%,10%{transform:scaleY(1)}75%,100%{transform:scaleY(.08)}}
@keyframes tip{0%,70%{transform:translateY(0);opacity:0}78%{opacity:1;transform:translateY(0)}95%{transform:translateY(16px);opacity:1}100%{transform:translateY(18px);opacity:0}}
@keyframes ripple{0%,92%{transform:scale(0);opacity:0}95%{opacity:1}100%{transform:scale(1.6);opacity:0}}
@keyframes draw{0%{stroke-dashoffset:340;opacity:1}80%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
@keyframes head{0%{stroke-dashoffset:0}80%{stroke-dashoffset:-334}100%{stroke-dashoffset:-334;opacity:0}}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.2)}30%{transform:scale(.96)}45%{transform:scale(1.1)}60%{transform:scale(1)}}
@keyframes splitL{0%,20%{transform:translateX(0) scale(1)}65%,85%{transform:translateX(-26px) scale(.82)}100%{transform:translateX(0) scale(1)}}
@keyframes splitR{0%,20%{transform:translateX(0) scale(1)}65%,85%{transform:translateX(26px) scale(.82)}100%{transform:translateX(0) scale(1)}}
@keyframes heal{0%,60%{stroke:#FF5B2E;opacity:1}85%,100%{stroke:#FFB59A;opacity:.25}}
@keyframes stitch{0%{stroke-dashoffset:30}15%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:0;opacity:0}}
@keyframes pour{0%,5%{transform:scaleY(0)}45%,85%{transform:scaleY(1)}100%{transform:scaleY(0)}}
@keyframes armT{0%,100%{transform:translateY(-34px);opacity:0}30%,75%{transform:translateY(0);opacity:1}}
@keyframes armB{0%,100%{transform:translateY(34px);opacity:0}30%,75%{transform:translateY(0);opacity:1}}
@keyframes armL{0%,100%{transform:translateX(-34px);opacity:0}30%,75%{transform:translateX(0);opacity:1}}
@keyframes armR{0%,100%{transform:translateX(34px);opacity:0}30%,75%{transform:translateX(0);opacity:1}}
@keyframes turn{0%,35%{transform:rotate(0)}60%,100%{transform:rotate(90deg)}}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes stepA{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes stepB{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.step{font-size:32px}.bar{width:200px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>

<script type="text/x-dc" data-dc-script data-props='{"ground":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":1440,"height":1500}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { p: 0, done: false, sel: 'lungs', ground: '' }; }
  componentDidMount() { this.tick(); }
  componentWillUnmount() { clearTimeout(this.t); }
  tick() {
    this.t = setTimeout(() => {
      const s = this.state;
      if (s.done) { this.setState({ p: 0, done: false }); this.tick(); return; }
      if (s.p >= 100) { this.setState({ done: true }); this.t = setTimeout(() => this.tick(), 1500); return; }
      this.setState({ p: Math.min(100, s.p + (s.p < 30 ? 1.5 : s.p < 75 ? 1 : 1.8)) });
      this.tick();
    }, 60);
  }
  renderVals() {
    const s = this.state;
    const ground = s.ground || this.props.ground || 'dark';
    const p = s.done ? 100 : s.p;
    const idx = s.done ? 3 : p < 30 ? 0 : p < 65 ? 1 : 2;
    const STEPS = ['Reading the letter', 'Citing every fact', 'Checking 8 studies', 'Ready'];
    const IDS = ['lungs', 'focus', 'helix', 'drip', 'capsule', 'dose', 'pulse', 'divide', 'stitch', 'tubes', 'cross', 'bond'];
    const t = {};
    IDS.forEach((id) => { t[id] = { cls: 'tile' + (s.sel === id ? ' sel' : ''), on: String(s.sel === id), pick: () => this.setState({ sel: id }) }; });
    return {
      stageCls: 'stage' + (ground === 'light' ? ' light' : ''),
      isDark: String(ground === 'dark'), isLight: String(ground === 'light'),
      dark: () => this.setState({ ground: 'dark' }), light: () => this.setState({ ground: 'light' }),
      step: STEPS[idx], stepCls: 'step dsp ' + (idx % 2 ? 'sA' : 'sB'),
      dots: STEPS.map((x, i) => ({ cls: 'dot' + (s.done ? ' ok' : i <= idx ? ' on' : '') })),
      barCls: 'bar' + (s.done ? ' ok' : ''), barW: p.toFixed(1) + '%',
      t: t
    };
  }
}
</script>
