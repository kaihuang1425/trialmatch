<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relay · Referrals</title>
<link rel="stylesheet" href="shared/tokens.css">
<style>
  /* ---------- Layout ---------- */
  .app { display: grid; grid-template-columns: 76px minmax(0, 1fr); min-height: 100vh; background: linear-gradient(90deg, var(--dark) 76px, transparent 76px); }
  .rail {
    position: sticky; top: 0; height: 100vh; background: var(--dark); color: var(--on-dark);
    display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 18px 0;
  }
  .brand { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; margin-bottom: 18px; background: var(--dark-3); }
  .brand svg { width: 22px; height: 22px; }
  .rail__btn {
    position: relative; width: 48px; height: 48px; border-radius: 14px; border: 0; background: transparent; color: var(--on-dark-muted);
    display: grid; place-items: center; text-decoration: none; transition: background var(--t-sm) var(--ease-out), color var(--t-sm) var(--ease-out);
  }
  .rail__btn svg { width: 22px; height: 22px; }
  .rail__btn:hover { background: var(--dark-2); color: var(--on-dark); }
  .rail__btn[aria-current="page"] { background: var(--dark-3); color: var(--on-dark); }
  .rail__spacer { flex: 1; }
  .bubble {
    position: absolute; top: 4px; right: 3px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
    background: var(--alarm); color: var(--on-alarm); font: 600 11px/18px var(--font-mono); text-align: center;
  }
  .bubble[data-zero="true"] { display: none; }

  .main { min-width: 0; padding: 36px clamp(16px, 4vw, 56px) 120px; }
  .main:focus, .agent:focus { outline: none; }
  .wrap { max-width: 1160px; margin: 0 auto; }

  /* ---------- Page head ---------- */
  .head { display: flex; align-items: flex-end; gap: 24px; flex-wrap: wrap; }
  .head__title { flex: 1 1 auto; min-width: 0; }
  .head h1 { margin: 0; font: 500 clamp(36px, 5vw, 52px)/1.02 var(--font-display); letter-spacing: -.025em; }
  .head__count { margin-top: 6px; color: var(--muted); }
  .search { position: relative; flex: 0 1 340px; min-width: 240px; }
  .search svg { position: absolute; left: 14px; top: 50%; width: 18px; height: 18px; transform: translateY(-50%); color: var(--muted); }
  .search input {
    width: 100%; height: 46px; border-radius: 999px; border: 1px solid var(--rule-strong); background: var(--surface);
    padding: 0 76px 0 42px; transition: border-color var(--t-sm) var(--ease-out), box-shadow var(--t-sm) var(--ease-out);
  }
  .search input:focus { outline: none; border-color: var(--focus); box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 18%, transparent); }
  .search__n { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }

  .tabs { position: relative; display: flex; gap: 4px; margin: 26px 0 18px; border-bottom: 1px solid var(--rule); overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    position: relative; min-height: 46px; padding: 0 14px; border: 0; background: transparent; color: var(--muted); font-weight: 500; white-space: nowrap;
    display: inline-flex; align-items: center; gap: 8px; transition: color var(--t-sm) var(--ease-out);
  }
  .tab:hover, .tab[aria-selected="true"] { color: var(--ink); }
  .tab .mono { color: var(--muted); }
  .tabs__line { position: absolute; bottom: -1px; left: 0; height: 2px; width: 0; background: var(--ink); border-radius: 2px; transition: transform var(--t-md) var(--ease-out), width var(--t-md) var(--ease-out); }
  .tab__short { display: none; }

  /* ---------- Patient group ---------- */
  .group { background: var(--ground-2); border-radius: var(--r-xl); padding: 20px; }
  .pt { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
  .pt__id { flex: 1 1 320px; min-width: 0; }
  .pt__name { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .pt__name h2 { margin: 0; font: 500 26px/1.1 var(--font-display); letter-spacing: -.02em; }
  .pt__meta { margin-top: 4px; color: var(--ink-2); }
  .pt__facts { color: var(--muted); }
  .docs { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .doc {
    position: relative; overflow: hidden; display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 12px 0 10px; border-radius: 12px;
    background: var(--surface); border: 1px solid var(--rule); font-size: 13.5px;
  }
  .doc svg { width: 18px; height: 18px; color: var(--source); flex: none; }
  .doc .mono { color: var(--muted); }
  .doc[data-stale="true"] .doc__clock { color: var(--open); }
  .doc__clock { width: 16px !important; height: 16px !important; }
  .doc__sweep { position: absolute; left: 0; bottom: 0; height: 2px; width: 100%; background: var(--source); transform-origin: left; transform: scaleX(0); }
  .doc[data-reading="true"] .doc__sweep { animation: sweep 320ms var(--ease-out) forwards; }
  @keyframes sweep { from { transform: scaleX(0); } to { transform: scaleX(1); opacity: .0; } }
  .add-doc { min-height: 44px; border-radius: 12px; border-style: dashed; padding: 0 14px; }

  /* ---------- Agent card ---------- */
  .agent {
    margin: 18px 0 16px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 16px; align-items: center;
    background: var(--surface); border-radius: var(--r-lg); padding: 16px 16px 16px 18px; box-shadow: var(--shadow-1);
  }
  .agent__mark { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--open-soft); color: var(--open); }
  .agent__mark svg { width: 22px; height: 22px; }
  .agent[data-mode="done"] .agent__mark { background: var(--ok-soft); color: var(--ok); }
  .agent[data-mode="alt"] .agent__mark { background: var(--source-soft); color: var(--source); }
  .agent__label { font: 500 11.5px/1.4 var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .agent__head { font-weight: 600; font-size: 16.5px; margin-top: 2px; }
  .agent__sub { color: var(--ink-2); margin-top: 2px; }
  .agent__chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .agent__chips .chip { position: relative; border: 0; cursor: pointer; min-height: 32px; transition: background var(--t-sm) var(--ease-out); }
  .agent__chips .chip::after { content: ""; position: absolute; inset: -6px 0; } /* 44px hit area, 32px visual */
  .agent__chips .chip:hover { background: var(--rule); }
  .agent__acts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .steps { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 4px; }
  .steps li { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--muted); }
  .steps li[data-done="true"] { color: var(--ink); }
  .steps li .glyph { width: 15px; height: 15px; }

  /* ---------- Cards ---------- */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 12px; }
  .slot { position: relative; border-radius: var(--r-lg); }
  .slot[hidden] { display: none; }
  .reveal {
    position: absolute; inset: 0; border-radius: var(--r-lg); display: flex; align-items: center; justify-content: space-between; padding: 0 22px;
    font-weight: 600; opacity: 0; transition: opacity var(--t-xs) linear;
  }
  .reveal span { display: inline-flex; align-items: center; gap: 8px; }
  .reveal svg { width: 20px; height: 20px; }
  .slot[data-reveal="invite"] .reveal { background: var(--ok-soft); color: var(--ok); }
  .slot[data-reveal="close"] .reveal { background: var(--conflict-soft); color: var(--conflict); }
  .slot[data-reveal="invite"] .reveal__close, .slot[data-reveal="close"] .reveal__invite { visibility: hidden; }

  .card {
    position: relative; background: var(--surface); border-radius: var(--r-lg); padding: 16px 16px 14px 18px; box-shadow: var(--shadow-1);
    display: flex; flex-direction: column; gap: 10px; touch-action: pan-y; user-select: none;
    transition: box-shadow var(--t-sm) var(--ease-out), transform var(--t-md) var(--ease-out);
  }
  .card:hover { box-shadow: var(--shadow-2); }
  .card[data-dragging="true"] { transition: none; box-shadow: var(--shadow-2); }
  .card[data-active="true"] { box-shadow: 0 0 0 2px var(--ink), var(--shadow-2); }
  .card[data-ring="true"] { animation: ring-once 320ms var(--ease-out) 1; }
  .card__open { position: absolute; inset: 0; z-index: 0; border: 0; background: transparent; border-radius: inherit; }
  .card__open:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .card > *:not(.card__open) { position: relative; z-index: 1; pointer-events: none; }
  .card .card__save, .card .card__next { pointer-events: auto; }
  .card__top { display: flex; align-items: flex-start; gap: 10px; }
  .card__name { flex: 1; min-width: 0; }
  .card__acr { font: 500 21px/1.15 var(--font-display); letter-spacing: -.015em; }
  .card__phase { color: var(--muted); margin-top: 2px; }
  .card__save { width: 44px; height: 44px; margin: -8px -8px 0 0; border-radius: 12px; border: 0; background: transparent; color: var(--muted); display: grid; place-items: center; opacity: 0; transition: opacity var(--t-sm) var(--ease-out), color var(--t-sm) var(--ease-out), background var(--t-sm) var(--ease-out); }
  .card__save svg { width: 20px; height: 20px; }
  .card:hover .card__save, .card:focus-within .card__save, .card__save[aria-pressed="true"] { opacity: 1; }
  .card__save:hover { background: var(--ground-2); color: var(--ink); }
  .card__save[aria-pressed="true"] { color: var(--ink); }
  .card__save[aria-pressed="true"] svg { fill: currentColor; }
  .card__title { color: var(--muted); font-size: 13.5px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card__status { display: grid; }
  .card__status > span { grid-area: 1 / 1; font-weight: 600; font-size: 14.5px; transition: opacity var(--t-md) var(--ease-out), transform var(--t-md) var(--ease-out); }
  .card__status > span[data-out="true"] { opacity: 0; transform: translateY(-4px); }
  .st-ready { color: var(--ok); } .st-needs_evidence { color: var(--open); } .st-needs_review { color: var(--review); } .st-not_match { color: var(--conflict); }
  .card__ev { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .counts { color: var(--muted); font-size: 12.5px; display: inline-flex; gap: 10px; }
  .counts b { font-weight: 500; color: var(--ink-2); }
  .card__front { display: flex; gap: 8px; align-items: flex-start; font-size: 13.5px; color: var(--ink-2); min-height: 20px; }
  .card__front .glyph { width: 16px; height: 16px; margin-top: 1px; }
  .card__foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 2px; min-width: 0; }
  .card__site { display: flex; align-items: center; gap: 6px; min-width: 0; white-space: nowrap; }
  .card__site-name { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .card__site .glyph { color: var(--source); flex: none; }
  .changed { font: 500 11.5px/1 var(--font-mono); color: var(--ink-2); padding: 6px 8px; border-radius: 999px; background: var(--ground-2); opacity: 0; transform: translateY(4px); transition: opacity var(--t-md) var(--ease-out), transform var(--t-md) var(--ease-out); }
  .changed[data-on="true"] { opacity: 1; transform: none; }
  .card__next { min-height: 44px; padding: 0 14px; font-size: 13.5px; margin-left: auto; }
  .card__next svg { width: 16px; height: 16px; }

  .empty { text-align: center; padding: 48px 16px; display: grid; justify-items: center; gap: 14px; color: var(--ink-2); }
  .empty[hidden] { display: none; }

  /* ---------- Details panel (one floating layer) ---------- */
  .panel {
    position: fixed; z-index: 60; top: 0; right: 0; bottom: 0; width: min(500px, 100vw); background: var(--surface); box-shadow: var(--shadow-2);
    display: flex; flex-direction: column; transform: translateX(104%); visibility: hidden;
    transition: transform var(--t-lg) var(--ease-out), visibility 0s linear var(--t-lg);
  }
  .panel[data-open="true"] { transform: none; visibility: visible; transition: transform var(--t-lg) var(--ease-out), visibility 0s; }
  .panel__head { padding: 20px 20px 0 24px; }
  .panel__bar { display: flex; align-items: flex-start; gap: 8px; }
  .panel__bar h2 { flex: 1; margin: 0; font: 500 28px/1.1 var(--font-display); letter-spacing: -.02em; outline: none; }
  .panel__sub { color: var(--muted); margin-top: 6px; display: flex; gap: 6px 12px; flex-wrap: wrap; align-items: center; }
  .src-link { color: var(--source); text-decoration: none; display: inline-flex; align-items: center; gap: 4px; min-height: 32px; }
  .src-link:hover { text-decoration: underline; }
  .panel__status { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-weight: 600; }
  .panel__ver { margin-top: 6px; color: var(--muted); font-size: 12.5px; }
  .ptabs { position: relative; display: flex; gap: 2px; margin-top: 14px; border-bottom: 1px solid var(--rule); }
  .ptabs .tab { min-height: 44px; padding: 0 12px; }
  .panel__body { flex: 1; overflow-y: auto; padding: 8px 12px 16px 16px; overscroll-behavior: contain; }
  .panel__foot { border-top: 1px solid var(--rule); padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: var(--surface); }
  .acts { display: flex; gap: 8px; flex-wrap: wrap; }
  .acts .btn { flex: 1 1 auto; }

  .rows { list-style: none; margin: 0; padding: 0; }
  .row { border-radius: 14px; transition: background var(--t-sm) var(--ease-out); }
  .row + .row { margin-top: 2px; }
  .row[data-open="true"] { background: var(--ground); }
  .row__btn { width: 100%; min-height: 52px; display: grid; grid-template-columns: 20px minmax(0, 1fr) auto 16px; gap: 10px; align-items: center; padding: 8px 10px; text-align: left; border: 0; background: transparent; border-radius: 14px; }
  .row__btn:hover { background: var(--ground); }
  .row__req { font-weight: 500; }
  .row__kind { display: block; color: var(--muted); font-size: 12px; }
  .row__val { color: var(--ink-2); text-align: right; max-width: 150px; }
  .row__chev { width: 16px; height: 16px; color: var(--muted); transition: transform var(--t-sm) var(--ease-out); }
  .row[data-open="true"] .row__chev { transform: rotate(90deg); }
  .row__more { display: grid; grid-template-rows: 0fr; transition: grid-template-rows var(--t-md) var(--ease-out); }
  .row[data-open="true"] .row__more { grid-template-rows: 1fr; }
  .row__inner { overflow: hidden; }
  .row__pad { padding: 2px 12px 14px 40px; display: grid; gap: 10px; }
  .lbl { font: 500 11px/1.4 var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .verbatim { margin: 4px 0 0; font-size: 13.5px; color: var(--ink-2); border-radius: 10px; }
  .passage { background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; padding: 10px 12px; font-size: 13.5px; }
  .passage__src { display: flex; align-items: center; gap: 6px; color: var(--source); font-size: 12.5px; margin-bottom: 6px; }
  .passage__src svg { width: 15px; height: 15px; }
  .hl { background: linear-gradient(var(--source-soft), var(--source-soft)) no-repeat left / 0% 100%; color: var(--ink); border-radius: 3px; padding: 0 1px; }
  .row[data-open="true"] .hl { animation: hl-sweep 320ms var(--ease-out) 120ms forwards; }
  @keyframes hl-sweep { to { background-size: 100% 100%; } }
  .note { font-size: 13px; color: var(--ink-2); display: flex; gap: 6px; align-items: flex-start; }
  .note svg { width: 15px; height: 15px; flex: none; margin-top: 2px; }
  .note--open { color: var(--open); } .note--review { color: var(--review); } .note--conflict { color: var(--conflict); }
  .row__tools { display: flex; gap: 8px; flex-wrap: wrap; }
  .row__tools .btn { min-height: 44px; font-size: 13.5px; padding: 0 12px; }
  .fix { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .fix select, .fix input { height: 44px; border-radius: 10px; border: 1px solid var(--rule-strong); background: var(--surface); padding: 0 10px; }
  .row .glyph { transition: transform var(--t-sm) var(--spring); }

  .inline { border-radius: 16px; background: var(--ground); padding: 14px; display: grid; gap: 12px; animation: drop-inA var(--t-md) var(--ease-out) both; }
  .inline h3 { margin: 0; font-size: 15px; }
  .reasons { display: grid; gap: 4px; }
  .reason { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 10px; border-radius: 12px; cursor: pointer; }
  .reason:hover { background: var(--ground-2); }
  .reason input { width: 18px; height: 18px; accent-color: var(--ink); }
  .draft { width: 100%; min-height: 128px; resize: vertical; border-radius: 12px; border: 1px solid var(--rule-strong); background: var(--surface); padding: 10px 12px; line-height: 1.5; }
  .unblocks { display: flex; gap: 6px; flex-wrap: wrap; }

  .hist { list-style: none; margin: 0; padding: 4px 8px; display: grid; gap: 2px; }
  .hist li { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 10px; padding: 8px 4px; border-bottom: 1px solid var(--rule); font-size: 13.5px; }
  .hist li:last-child { border-bottom: 0; }
  .hist .who { font-weight: 600; }
  .hist li[data-new="true"] { animation: drop-inA var(--t-md) var(--ease-out) both; }
  .chg { list-style: none; margin: 0; padding: 4px 4px; display: grid; gap: 10px; }
  .chg__trial { background: var(--ground); border-radius: 14px; padding: 12px 14px; }
  .chg__name { display: flex; justify-content: space-between; gap: 10px; font-weight: 600; flex-wrap: wrap; }
  .chg__arrow { display: inline-flex; gap: 6px; align-items: center; font-weight: 500; font-size: 13.5px; }
  .chg__rows { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 4px; font-size: 13.5px; }
  .chg__rows li { display: flex; gap: 6px; align-items: center; }
  .chg__rows .glyph { width: 15px; height: 15px; }

  /* ---------- Synthetic report sheet ---------- */
  .scrim { position: fixed; inset: 0; z-index: 70; background: rgba(12, 18, 16, .36); opacity: 0; visibility: hidden; transition: opacity var(--t-md) var(--ease-out), visibility 0s linear var(--t-md); }
  .scrim[data-open="true"] { opacity: 1; visibility: visible; transition: opacity var(--t-md) var(--ease-out), visibility 0s; }
  .sheet {
    position: fixed; z-index: 71; left: 50%; top: 50%; width: min(760px, calc(100vw - 32px)); max-height: calc(100vh - 48px); overflow: auto;
    background: var(--surface); border-radius: var(--r-xl); box-shadow: var(--shadow-2); padding: 22px;
    transform: translate(-50%, -48%) scale(.98); opacity: 0; visibility: hidden;
    transition: transform var(--t-md) var(--ease-out), opacity var(--t-md) var(--ease-out), visibility 0s linear var(--t-md);
  }
  .sheet[data-open="true"] { transform: translate(-50%, -50%); opacity: 1; visibility: visible; transition: transform var(--t-md) var(--ease-out), opacity var(--t-md) var(--ease-out), visibility 0s; }
  .sheet__bar { display: flex; align-items: center; gap: 10px; }
  .sheet__bar h2 { margin: 0; flex: 1; font: 500 26px/1.1 var(--font-display); letter-spacing: -.02em; outline: none; }
  .sheet__grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; margin-top: 16px; }
  .field { display: grid; gap: 6px; margin-bottom: 12px; }
  .field > span { font-size: 13px; font-weight: 500; color: var(--ink-2); }
  .seg-ctl { display: flex; flex-wrap: wrap; gap: 4px; background: var(--ground); padding: 4px; border-radius: 14px; }
  .seg-ctl button { flex: 1 1 auto; min-height: 44px; border: 0; border-radius: 10px; background: transparent; padding: 0 10px; font-size: 13.5px; color: var(--ink-2); transition: background var(--t-sm) var(--ease-out), color var(--t-sm) var(--ease-out), box-shadow var(--t-sm) var(--ease-out); }
  .seg-ctl button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-1); font-weight: 500; }
  .stepper { display: flex; align-items: center; gap: 6px; }
  .stepper input { width: 84px; height: 44px; text-align: center; border-radius: 12px; border: 1px solid var(--rule-strong); background: var(--surface); font-family: var(--font-mono); }
  .preview { background: var(--ground); border-radius: 16px; padding: 14px; font: 400 12.5px/1.6 var(--font-mono); white-space: pre-wrap; color: var(--ink-2); min-height: 100%; }
  .preview mark { background: var(--source-soft); color: var(--ink); border-radius: 3px; padding: 0 2px; }
  .preview mark[data-flash="A"] { animation: flashA 300ms var(--ease-out); }
  .preview mark[data-flash="B"] { animation: flashB 300ms var(--ease-out); }
  @keyframes flashA { from { box-shadow: 0 0 0 4px color-mix(in srgb, var(--source) 35%, transparent); } to { box-shadow: 0 0 0 0 transparent; } }
  @keyframes flashB { from { box-shadow: 0 0 0 4px color-mix(in srgb, var(--source) 35%, transparent); } to { box-shadow: 0 0 0 0 transparent; } }
  .sheet__foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }

  /* ---------- Board chrome ---------- */
  .chrome { position: fixed; z-index: 50; top: 12px; right: 12px; display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: color-mix(in srgb, var(--surface) 88%, transparent); border: 1px solid var(--rule); }
  .chrome .btn { min-height: 40px; height: 40px; width: 40px; padding: 0; border: 0; background: transparent; }
  .chrome .btn:hover { background: var(--ground-2); }
  .chrome .btn[aria-pressed="false"] { color: var(--muted); }

  /* ---------- Phone ---------- */
  @media (max-width: 760px) {
    .app { grid-template-columns: minmax(0, 1fr); }
    .rail { position: fixed; z-index: 40; top: auto; bottom: 0; left: 0; right: 0; height: 64px; flex-direction: row; justify-content: space-around; padding: 0 8px calc(env(safe-area-inset-bottom)); }
    .brand, .rail__spacer { display: none; }
    .main { padding: 64px 16px 110px; }
    .search { flex: 1 1 100%; }
    .tab__long { display: none; } .tab__short { display: inline; }
    .tab { padding: 0 10px; }
    .group { padding: 14px; border-radius: 20px; margin: 0 -4px; }
    .app { background: none; }
    .agent { grid-template-columns: auto minmax(0, 1fr); align-items: start; }
    .agent__mark { width: 36px; height: 36px; }
    .agent__chips .chip { min-height: 44px; padding: 2px 14px; }
    .agent__acts { grid-column: 1 / -1; justify-content: stretch; }
    .agent__acts .btn { flex: 1; }
    .cards { grid-template-columns: minmax(0, 1fr); }
    .card__save { opacity: 1; }
    .row__btn { grid-template-columns: 20px minmax(0, 1fr) 16px; }
    .row__val { grid-column: 2; grid-row: 2; text-align: left; max-width: none; }
    .row__chev { grid-column: 3; grid-row: 1; }
    .row__pad { padding-left: 12px; }
    .sheet { top: auto; bottom: 0; left: 0; width: 100vw; max-height: 92vh; border-radius: 24px 24px 0 0; transform: translateY(16px); padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); }
    .sheet[data-open="true"] { transform: none; }
    .sheet__grid { grid-template-columns: minmax(0, 1fr); }
    .chrome { top: 8px; right: 8px; }
    .toasts { bottom: 76px; }
  }
</style>
</head>
<body>
<div class="chrome" aria-label="Board controls">
  <button class="btn btn--icon" id="ch-theme" type="button" aria-label="Theme: auto"></button>
  <button class="btn btn--icon" id="ch-motion" type="button" aria-label="Motion" aria-pressed="true"></button>
  <button class="btn btn--icon" id="ch-reset" type="button" aria-label="Reset board"></button>
</div>

<div class="app">
  <nav class="rail" aria-label="Main">
    <div class="brand" aria-hidden="true"></div>
    <a class="rail__btn" id="nav-ref" href="#" aria-current="page" aria-label="Referrals"><span data-icon="queue"></span><span class="bubble mono" id="nav-bubble"></span></a>
    <button class="rail__btn" id="nav-activity" type="button" aria-label="Activity"><span data-icon="history"></span></button>
    <a class="rail__btn" id="nav-patient" href="patient.html" aria-label="Patient view"><span data-icon="user"></span></a>
    <div class="rail__spacer"></div>
  </nav>

  <main class="main" id="main" tabindex="-1" data-focus-fallback>
    <div class="wrap">
      <header class="head">
        <div class="head__title">
          <h1>Referrals</h1>
          <div class="head__count mono" id="head-count"></div>
        </div>
        <label class="search">
          <span class="sr-only">Search referrals</span>
          <span data-icon="search"></span>
          <input id="q" type="search" autocomplete="off" placeholder="Search studies, NCT, drugs">
          <span class="search__n mono" id="q-n" aria-live="polite"></span>
        </label>
      </header>

      <div class="tabs" role="tablist" aria-label="Referral stage" id="tabs">
        <button class="tab" role="tab" id="tab-review" data-tab="review" aria-selected="true" aria-controls="cards"><span class="tab__long">To review</span><span class="tab__short">Review</span> <span class="mono" data-count="review"></span></button>
        <button class="tab" role="tab" id="tab-waiting" data-tab="waiting" aria-selected="false" aria-controls="cards" tabindex="-1"><span class="tab__long">Waiting on evidence</span><span class="tab__short">Waiting</span> <span class="mono" data-count="waiting"></span></button>
        <button class="tab" role="tab" id="tab-invited" data-tab="invited" aria-selected="false" aria-controls="cards" tabindex="-1">Invited <span class="mono" data-count="invited"></span></button>
        <button class="tab" role="tab" id="tab-closed" data-tab="closed" aria-selected="false" aria-controls="cards" tabindex="-1">Closed <span class="mono" data-count="closed"></span></button>
        <span class="tabs__line" id="tabs-line" aria-hidden="true"></span>
      </div>

      <section class="group" aria-labelledby="pt-name">
        <div class="pt">
          <div class="pt__id">
            <div class="pt__name"><h2 id="pt-name" class="mono" style="font-family: var(--font-display)">SYN-0417</h2><span class="synthetic">Synthetic</span></div>
            <div class="pt__meta">63 · Nonsquamous adenocarcinoma · Stage IVA · London, travels ≤ 60 mi</div>
            <div class="pt__facts mono" id="pt-facts"></div>
          </div>
        </div>
        <div class="docs" id="docs"></div>

        <div class="agent" id="agent" tabindex="-1" aria-live="polite"></div>

        <div class="cards" id="cards" role="tabpanel" aria-labelledby="tab-review"></div>
        <div class="empty" id="empty" hidden></div>
      </section>
    </div>
  </main>
</div>

<aside class="panel" id="panel" aria-labelledby="p-title" role="dialog" aria-modal="false"></aside>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="s-title"></div>

<pre id="selftest-log" class="sr-only"></pre>
<script src="shared/kit.js"></script>
<script src="coordinator.js"></script>
</body>
</html>
