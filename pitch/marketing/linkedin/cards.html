<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<title>Reel cards</title>
<!-- Title and end cards for the LinkedIn reel. record.py opens cards.html?c=title and cards.html?c=end at 1080x1350.
     Edit the words in CARD_TEXT below, then run record.py again. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,300..700&display=swap">
<style>
  :root { --bg: #0E0E0F; --fg: #E3E3E3; --mute: #9AA0A6; --dim: #6F7378; --blue: #A8C7FA; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1080px; height: 1350px; overflow: hidden; background: var(--bg); color: var(--fg);
    font-family: 'Google Sans Flex', 'Google Sans', Roboto, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  .card { position: absolute; inset: 0; display: none; flex-direction: column; justify-content: center; padding: 0 88px; }
  body[data-c="title"] .card.title, body[data-c="end"] .card.end { display: flex; }
  .halo { position: absolute; left: 50%; top: 46%; width: 1100px; height: 1100px; margin: -550px 0 0 -550px; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(66,133,244,.22), rgba(155,114,203,.10) 55%, transparent); animation: halo 2.4s ease-out both; }
  @keyframes halo { from { transform: scale(.4); opacity: 0 } to { transform: scale(1); opacity: 1 } }
  .grad { background: linear-gradient(90deg, #4285F4, #9B72CB 55%, #D96570); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .up { opacity: 0; transform: translateY(26px); animation: up .9s cubic-bezier(.2,.8,.2,1) forwards; }
  @keyframes up { to { opacity: 1; transform: none } }
  .mark { width: 84px; height: 84px; flex: none; }
  .pill { align-self: flex-start; display: inline-flex; align-items: center; gap: 14px; height: 60px; padding: 0 26px 0 20px; border-radius: 30px;
    background: linear-gradient(#161718, #161718) padding-box, linear-gradient(90deg, #4285F4, #9B72CB, #D96570) border-box; border: 2px solid transparent;
    font-size: 26px; font-weight: 500; letter-spacing: .01em; box-shadow: 0 0 40px rgba(155,114,203,.25); }
  .pill svg { width: 30px; height: 30px; }
  .brand { display: flex; align-items: center; gap: 26px; font-size: 112px; line-height: 1; font-weight: 500; letter-spacing: -.035em; }
  .line { height: 3px; width: 560px; border-radius: 2px; background: linear-gradient(90deg, #4285F4, #9B72CB, #D96570); transform-origin: 0 50%;
    transform: scaleX(0); animation: line 1s .55s cubic-bezier(.6,0,.2,1) forwards; }
  @keyframes line { to { transform: scaleX(1) } }
  .sub { font-size: 50px; line-height: 1.15; font-weight: 400; letter-spacing: -.02em; max-width: 17ch; }
  .sub i { font-style: normal; color: var(--dim); }
  .foot { position: absolute; left: 88px; right: 88px; bottom: 80px; display: flex; justify-content: space-between; font-size: 24px; color: var(--mute); }
  .title .stack { display: flex; flex-direction: column; gap: 44px; position: relative; }
  .end .stack { display: flex; flex-direction: column; gap: 30px; position: relative; }
  .end .brand { font-size: 64px; gap: 18px; }
  .end .brand .mark { width: 56px; height: 56px; }
  .k { font-size: 30px; font-weight: 500; color: var(--blue); }
  .url { font-size: 76px; line-height: 1.05; font-weight: 500; letter-spacing: -.03em; }
  .who { font-size: 30px; color: var(--fg); }
  .who span { color: var(--mute); }
  .small { font-size: 22px; color: var(--dim); }
  .shine { position: relative; display: inline-block; }
  .shine::after { content: ""; position: absolute; inset: -10px -20px; background: linear-gradient(100deg, transparent 35%, rgba(255,255,255,.35) 50%, transparent 65%);
    background-size: 250% 100%; background-position: 130% 0; mix-blend-mode: overlay; animation: shine 1.6s 1.1s ease-in-out forwards; }
  @keyframes shine { to { background-position: -40% 0 } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
  <symbol id="mark" viewBox="0 0 32 32"><rect x="2" y="11" width="28" height="10" rx="5" fill="#7B9BFE"/><rect x="11" y="2" width="10" height="28" rx="5" fill="#E48FB0"/><rect x="11" y="11" width="10" height="10" fill="#B48BE9"/></symbol>
</defs></svg>

<section class="card title">
  <div class="halo"></div>
  <div class="stack">
    <span class="pill up" style="animation-delay:.15s"><svg viewBox="0 0 24 24" fill="none" stroke="#FDD663" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg><span data-t="award"></span></span>
    <div class="brand up" style="animation-delay:.3s"><svg class="mark"><use href="#mark"/></svg><span>Trial Match</span></div>
    <div class="line"></div>
    <div class="sub up" style="animation-delay:.65s" data-t="tagline"></div>
  </div>
  <div class="foot up" style="animation-delay:1s"><span data-t="team"></span><span data-t="note"></span></div>
</section>

<section class="card end">
  <div class="halo"></div>
  <div class="stack">
    <div class="brand up" style="animation-delay:.1s"><svg class="mark"><use href="#mark"/></svg><span>Trial Match</span></div>
    <span class="k up" style="animation-delay:.35s; margin-top: 40px">Try the live demo</span>
    <span class="url up" style="animation-delay:.5s"><span class="shine"><span class="grad" data-t="url"></span></span></span>
    <span class="who up" style="animation-delay:.8s; margin-top: 30px" data-t="who"></span>
  </div>
  <div class="foot up" style="animation-delay:1.1s"><span class="small" data-t="disclaimer"></span></div>
</section>

<script>
  // All the words on both cards. Keep the award line exactly as the organisers named the prize.
  var CARD_TEXT = {
    award: '1st place · AgentVerse 2026',
    tagline: 'Agents that find every clinical trial <i>a patient qualifies for.</i>',
    team: 'Team Legacy',
    note: 'UCL AI Society’s flagship hackathon',
    url: 'trial-match-ebon.vercel.app',
    who: 'Team Legacy <span>· 1st place, AgentVerse 2026</span>',
    disclaimer: 'Synthetic patients and demo data. Not a medical device.'
  };
  var q = new URLSearchParams(location.search);
  document.body.setAttribute('data-c', q.get('c') || 'title');
  Object.keys(CARD_TEXT).forEach(function (k) { if (q.has(k)) CARD_TEXT[k] = q.get(k); });
  document.querySelectorAll('[data-t]').forEach(function (el) { el.innerHTML = CARD_TEXT[el.getAttribute('data-t')]; });
</script>
</body>
</html>
